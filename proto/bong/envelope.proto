message ForgeStation {
  string station_id  = 1;
  uint32 tier        = 2; // Rust u8
  float  integrity   = 3;
  string owner_name  = 4;
  bool   has_session = 5;
}

// 与 Rust ForgeStepV1 精确对应。
enum ForgeStep {
  FORGE_STEP_UNSPECIFIED  = 0;
  FORGE_STEP_BILLET       = 1;
  FORGE_STEP_TEMPERING    = 2;
  FORGE_STEP_INSCRIPTION  = 3;
  FORGE_STEP_CONSECRATION = 4;
  FORGE_STEP_DONE         = 5;
}

// 与 Rust TemperBeatV1 精确对应。
enum TemperBeat {
  TEMPER_BEAT_UNSPECIFIED = 0;
  TEMPER_BEAT_LIGHT       = 1; // "L"
  TEMPER_BEAT_HEAVY       = 2; // "H"
  TEMPER_BEAT_FOLD        = 3; // "F"
}

// 与 Rust ForgeOutcomeBucketV1 精确对应。
enum ForgeOutcomeBucket {
  FORGE_OUTCOME_BUCKET_UNSPECIFIED = 0;
  FORGE_OUTCOME_BUCKET_PERFECT    = 1;
  FORGE_OUTCOME_BUCKET_GOOD       = 2;
  FORGE_OUTCOME_BUCKET_FLAWED     = 3;
  FORGE_OUTCOME_BUCKET_WASTE      = 4;
  FORGE_OUTCOME_BUCKET_EXPLODE    = 5;
}

// 材料 kv 对：Rust (String, u32) tuple。
message ForgeMaterialPair {
  string material = 1;
  uint32 count    = 2;
}

// 与 Rust ForgeStepStateDataV1 精确对应 — tagged union by step。
// proto oneof 拆为 5 variant message。
message ForgeStepStateBillet {
  repeated ForgeMaterialPair materials_in = 1;
  optional string            active_carrier       = 2;
  uint32                     resolved_tier_cap    = 3;
}

message ForgeStepStateTempering {
  repeated TemperBeat pattern     = 1;
  uint32              beat_cursor = 2;
  uint32              hits        = 3;
  uint32              misses      = 4;
  uint32              deviation   = 5;
  double              qi_spent    = 6;
}

message ForgeStepStateInscription {
  uint32 filled_slots = 1;
  uint32 max_slots    = 2;
  bool   failed       = 3;
}

message ForgeStepStateConsecration {
  double           qi_injected    = 1;
  double           qi_required    = 2;
  optional ColorKind color_imprint = 3;
}

message ForgeStepState {
  oneof state {
    ForgeStepStateBillet       billet       = 1;
    ForgeStepStateTempering    tempering    = 2;
    ForgeStepStateInscription  inscription  = 3;
    ForgeStepStateConsecration consecration = 4;
    bool                       none_state   = 5; // ForgeStepStateDataV1::None
  }
}

// 与 Rust ForgeSessionDataV1 精确对应。
message ForgeSessionData {
  uint64         session_id     = 1;
  string         blueprint_id   = 2;
  string         blueprint_name = 3;
  bool           active         = 4;
  ForgeStep      current_step   = 5;
  uint32         step_index     = 6;
  uint32         achieved_tier  = 7;
  ForgeStepState step_state     = 8;
}

// 与 Rust ForgeOutcomeDataV1 精确对应。
message ForgeOutcome {
  uint64             session_id    = 1;
  string             blueprint_id  = 2;
  ForgeOutcomeBucket bucket        = 3;
  optional string    weapon_item   = 4;
  float              quality       = 5;
  optional ColorKind color         = 6;
  repeated string    side_effects  = 7;
  uint32             achieved_tier = 8;
  bool               flawed_path   = 9;
}

// 与 Rust ForgeBlueprintEntryV1 精确对应。
message ForgeBlueprintEntry {
  string id           = 1;
  string display_name = 2;
  uint32 tier_cap     = 3; // Rust u8
  uint32 step_count   = 4;
}

// 与 Rust ForgeBlueprintBookDataV1 精确对应。
message ForgeBlueprintBook {
  repeated ForgeBlueprintEntry learned = 1;
  uint32 current_index                 = 2;
}

