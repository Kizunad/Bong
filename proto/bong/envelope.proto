    InventoryEvent          inventory_event         = 80;
    DroppedLootSync         dropped_loot_sync       = 81;
    RiftPortalState         rift_portal_state       = 82;
    RiftPortalRemoved       rift_portal_removed     = 83;
    ExtractStarted          extract_started         = 84;
    ExtractProgress         extract_progress        = 85;
    ExtractCompleted        extract_completed       = 86;
    ExtractAborted          extract_aborted         = 87;
    ExtractFailed           extract_failed          = 88;
    TsyCollapseStartedIpc   tsy_collapse_started    = 89;
    ContainerStateProto     container_state         = 90;
    SearchStarted           search_started          = 91;
    SearchProgress          search_progress         = 92;
    SearchCompleted         search_completed        = 93;
    SearchAborted           search_aborted          = 94;
    SkillLvUp               skill_lv_up             = 95;
    SkillCapChanged         skill_cap_changed       = 96;
    SkillScrollUsed         skill_scroll_used       = 97;
    SkillSnapshotProto      skill_snapshot          = 98;
    FullPowerChargingState  full_power_charging     = 99;
    FullPowerRelease        full_power_release      = 100;
    FullPowerExhaustedState full_power_exhausted    = 101;
    HealerNpcAiState        healer_npc_ai_state     = 102;
    YidaoHudState           yidao_hud_state         = 103;
    MovementStateProto      movement_state          = 104;
    SpiritTreasureStateProto  spirit_treasure_state  = 105;
    SpiritTreasureDialogueProto spirit_treasure_dialogue = 106;
    // ─── 专用 channel payloads ───────────────────────────────────
    VfxEvent                vfx_event               = 107;
    AudioPlayEvent          audio_play_event        = 108;
    AudioStopEvent          audio_stop_event        = 109;
    AmbientZoneEvent        ambient_zone_event      = 110;
    ZoneEnvironmentState    zone_environment_state  = 111;
    MutationStateProto      mutation_state          = 112;
    MutationEventProto      mutation_event          = 113;
    DandaoStyleProto        dandao_style            = 114;
    TsyEnterEvent           tsy_enter_event         = 115;
    TsyExitEvent            tsy_exit_event          = 116;
    TsyNpcSpawned           tsy_npc_spawned         = 117;
    TsySentinelPhaseChanged tsy_sentinel_phase_changed = 118;
    // P2/P3 阶段继续追加 field 119..N。
    // 字段编号一旦分配永不复用（buf breaking 检测保证）。
  }
}

