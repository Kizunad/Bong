// Server↔Client IPC 信封 — 替代现有 JSON tagged union。
//
// P0 阶段只放少量占位 message 证明 codegen pipeline 跑通。
// P1 阶段补齐 10 个高频 payload 的完整 proto 定义。
// 完整的 106 S2C + 88 C2S payload 在 P2/P3 阶段逐步填充。
syntax = "proto3";

package bong;

import "bong/common.proto";

// ─── S2C 信封（Server → Client） ────────────────────────────────

message ServerDataEnvelope {
  oneof payload {
    Welcome           welcome            = 1;
    Heartbeat         heartbeat          = 2;
    NarrationBatch    narration          = 3;
    ZoneInfo          zone_info          = 4;
    PlayerState       player_state       = 5;
    CultivationDetail cultivation_detail = 6;
    SkillXpGain       skill_xp_gain      = 7;
    InventorySnapshot inventory_snapshot = 8;
    CombatHudState    combat_hud_state   = 9;
    KnockbackSync     knockback_sync     = 10;
    // ─── P2 B1：炼丹 / 锻造 / 工坊 / 采集 / 灵田 ──────────────
    AlchemyFurnace          alchemy_furnace           = 11;
    AlchemySession          alchemy_session           = 12;
    AlchemyOutcomeForecast  alchemy_outcome_forecast  = 13;
    AlchemyOutcomeResolved  alchemy_outcome_resolved  = 14;
    AlchemyRecipeBook       alchemy_recipe_book       = 15;
    AlchemyContamination    alchemy_contamination     = 16;
    ForgeStation            forge_station             = 17;
    ForgeSessionData        forge_session             = 18;
    ForgeOutcome            forge_outcome             = 19;
    ForgeBlueprintBook      forge_blueprint_book      = 20;
    CraftRecipeList         craft_recipe_list         = 21;
    CraftSessionState       craft_session_state       = 22;
    CraftOutcome            craft_outcome             = 23;
    RecipeUnlocked          recipe_unlocked           = 24;
    BotanyHarvestProgress   botany_harvest_progress   = 25;
    BotanyPlantV2RenderProfiles botany_plant_v2_render_profiles = 26;
    BotanySkill             botany_skill              = 27;
    MiningProgress          mining_progress           = 28;
    LumberProgress          lumber_progress           = 29;
    GatheringSession        gathering_session         = 30;
    LingtianSessionData     lingtian_session          = 31;
    // P2/P3 阶段继续追加 field 32..N。
    // 字段编号一旦分配永不复用（buf breaking 检测保证）。
  }
}

// ─── C2S 信封（Client → Server） ────────────────────────────────

message ClientRequestEnvelope {
  oneof payload {
    SetMeridianTarget   set_meridian_target   = 1;
    BreakthroughRequest breakthrough_request  = 2;
    // ─── P2 B1：炼丹 / 锻造 / 工坊 / 采集 / 灵田 / 矿石 ──────
    AlchemyOpenFurnace        alchemy_open_furnace        = 3;
    AlchemyFeedSlot           alchemy_feed_slot           = 4;
    AlchemyTakeBack           alchemy_take_back           = 5;
    AlchemyIgnite             alchemy_ignite              = 6;
    AlchemyIntervention       alchemy_intervention        = 7;
    AlchemyTurnPage           alchemy_turn_page           = 8;
    AlchemyLearnRecipe        alchemy_learn_recipe        = 9;
    AlchemyLearnRecipeFragment alchemy_learn_recipe_fragment = 10;
    AlchemyTakePill           alchemy_take_pill           = 11;
    ForgeStartSession         forge_start_session         = 12;
    ForgeTemperingHit         forge_tempering_hit         = 13;
    ForgeInscriptionScroll    forge_inscription_scroll    = 14;
    ForgeConsecrationInject   forge_consecration_inject   = 15;
    ForgeStepAdvance          forge_step_advance          = 16;
    ForgeBlueprintTurnPage    forge_blueprint_turn_page   = 17;
    ForgeLearnBlueprint       forge_learn_blueprint       = 18;
    CraftStart                craft_start                 = 19;
    CraftCancel               craft_cancel                = 20;
    BotanyHarvestRequest      botany_harvest_request      = 21;
    LingtianStartTill         lingtian_start_till         = 22;
    LingtianStartRenew        lingtian_start_renew        = 23;
    LingtianStartPlanting     lingtian_start_planting     = 24;
    LingtianStartHarvest      lingtian_start_harvest      = 25;
    LingtianStartReplenish    lingtian_start_replenish    = 26;
    LingtianStartDrainQi      lingtian_start_drain_qi     = 27;
    MineralProbe              mineral_probe               = 28;
    // P2/P3 阶段继续追加。
  }
}

// ═══════════════════════════════════════════════════════════════
// S2C payload 定义
// ═══════════════════════════════════════════════════════════════

// ─── 1. Welcome ────────────────────────────────────────────────

message Welcome {
  string message = 1;
}

// ─── 2. Heartbeat ──────────────────────────────────────────────

message Heartbeat {
  string message = 1;
}

// ─── 3. Narration ──────────────────────────────────────────────
// 与 Rust Narration struct 精确对应：scope, target(optional), text, style, kind(optional)。

message NarrationEntry {
  string text            = 1;
  string scope           = 2; // broadcast / zone / player
  string style           = 3; // system_warning / perception / narration / era_decree / political_jianghu
  optional string target = 4; // 非 broadcast 时必填
  optional string kind   = 5; // death_insight / niche_intrusion / ...
}

message NarrationBatch {
  repeated NarrationEntry narrations = 1;
}

// ─── 4. ZoneInfo ───────────────────────────────────────────────
// 与 Rust ServerDataPayloadV1::ZoneInfo 精确对应。

message ZoneInfo {
  string zone                    = 1;
  double spirit_qi               = 2;
  uint32 danger_level            = 3; // Rust u8，proto uint32 安全包含
  string status                  = 4; // Normal / RaceOut / Collapsed
  repeated string active_events  = 5;
  optional string perception_text = 6;
}

// ─── 5. PlayerState ────────────────────────────────────────────
// 与 Rust ServerDataPayloadV1::PlayerState 精确对应。
// breakdown / season_state / social 作为嵌套 message。

message PlayerPowerBreakdown {
  double combat    = 1;
  double wealth    = 2;
  double social    = 3;
  double karma     = 4;
  double territory = 5;
}

// 与 Rust SeasonStateV1 精确对应。
enum Season {
  SEASON_UNSPECIFIED      = 0;
  SEASON_SUMMER           = 1;
  SEASON_SUMMER_TO_WINTER = 2;
  SEASON_WINTER           = 3;
  SEASON_WINTER_TO_SUMMER = 4;
}

message SeasonState {
  Season season            = 1;
  uint64 tick_into_phase   = 2;
  uint64 phase_total_ticks = 3;
  uint64 year_index        = 4;
}

// 与 Rust PlayerSocialSnapshotV1 精确对应。
// 嵌套 RenownSnapshot + RelationshipSnapshot + FactionMembershipSnapshot。

message RenownTag {
  string tag            = 1;
  double weight         = 2;
  uint64 last_seen_tick = 3;
  bool   permanent      = 4;
}

message RenownSnapshot {
  int32           fame      = 1;
  int32           notoriety = 2;
  repeated RenownTag top_tags = 3;
}

enum RelationshipKind {
  RELATIONSHIP_KIND_UNSPECIFIED = 0;
  RELATIONSHIP_KIND_MASTER     = 1;
  RELATIONSHIP_KIND_DISCIPLE   = 2;
  RELATIONSHIP_KIND_COMPANION  = 3;
  RELATIONSHIP_KIND_PACT       = 4;
  RELATIONSHIP_KIND_FEUD       = 5;
}

message RelationshipSnapshot {
  RelationshipKind kind       = 1;
  string           peer       = 2;
  uint64           since_tick = 3;
  string           metadata   = 4; // JSON string（Rust serde_json::Value）
}

message FactionMembershipSnapshot {
  string           faction                = 1;
  uint32           rank                   = 2; // Rust u8
  int32            loyalty                = 3;
  uint32           betrayal_count         = 4; // Rust u8
  optional uint64  invite_block_until_tick = 5;
  bool             permanently_refused    = 6;
}

message PlayerSocialSnapshot {
  RenownSnapshot                   renown             = 1;
  repeated RelationshipSnapshot    relationships      = 2;
  uint32                           exposed_to_count   = 3;
  optional FactionMembershipSnapshot faction_membership = 4;
}

message PlayerState {
  optional string            player             = 1;
  Realm                      realm              = 2;
  double                     spirit_qi          = 3;
  double                     karma              = 4;
  double                     composite_power    = 5;
  string                     zone               = 6;
  optional float             local_neg_pressure = 7;
  PlayerPowerBreakdown       breakdown          = 8;
  optional SeasonState       season_state       = 9;
  optional PlayerSocialSnapshot social          = 10;
}

// ─── 6. CultivationDetail ──────────────────────────────────────
// 经脉状态：每条经脉一个 MeridianState message（plan §8.1 #5 决议）。
// 额外字段与 Rust CultivationDetail variant 精确对应。

message MeridianState {
  MeridianId id            = 1;
  bool       opened        = 2;
  double     flow_rate     = 3;
  double     flow_capacity = 4;
  double     integrity     = 5;
  double     open_progress = 6;
  uint32     cracks_count  = 7;
}

message LifespanPreview {
  double years_lived           = 1;
  uint32 cap_by_realm          = 2;
  double remaining_years       = 3;
  uint32 death_penalty_years   = 4;
  double tick_rate_multiplier  = 5;
  bool   is_wind_candle        = 6;
}

message SkillMilestoneSnapshot {
  string skill       = 1;
  uint32 new_lv      = 2; // Rust u8
  uint64 achieved_at = 3;
  string narration   = 4;
  uint64 total_xp_at = 5;
}

message PracticeWeight {
  ColorKind color  = 1;
  double    weight = 2;
  double    ratio  = 3;
}

message CultivationDetail {
  Realm                          realm                             = 1;
  repeated MeridianState         meridians                         = 2;
  optional MeridianId            target_meridian                   = 3;
  double                         contamination_total               = 4;
  optional LifespanPreview       lifespan                          = 5;
  string                         recent_skill_milestones_summary   = 6;
  repeated SkillMilestoneSnapshot skill_milestones                 = 7;
  ColorKind                      qi_color_main                     = 8;
  optional ColorKind             qi_color_secondary                = 9;
  bool                           qi_color_chaotic                  = 10;
  bool                           qi_color_hunyuan                  = 11;
  repeated PracticeWeight        practice_weights                  = 12;
}

// ─── 7. SkillXpGain ────────────────────────────────────────────
// 与 Rust SkillXpGainPayloadV1 精确对应。
// XpGainSource 是 tagged union → proto oneof。

message XpGainSourceAction {
  string plan_id = 1;
  string action  = 2;
}

message XpGainSourceScroll {
  string scroll_id = 1;
  uint32 xp_grant  = 2;
}

message XpGainSourceMentor {
  uint64 mentor_char = 1;
}

message SkillXpGain {
  uint64 char_id = 1;
  SkillId skill  = 2;
  uint32 amount  = 3;
  oneof source {
    XpGainSourceAction  action_source       = 4;
    XpGainSourceScroll  scroll_source       = 5;
    XpGainSourceMentor  mentor_source       = 7;
  }
  // realm_breakthrough 变体无额外字段，单独 bool 标记存在性。
  bool source_realm_breakthrough = 6;
}

// ─── 8. InventorySnapshot ──────────────────────────────────────
// 与 Rust InventorySnapshotV1 精确对应。重型嵌套。
// 使用 common.proto 的 ItemSlot 做轻量引用；
// InventoryItemView 是完整物品视图（对应 Rust InventoryItemViewV1）。

message InventoryItemView {
  uint64           instance_id        = 1;
  string           item_id            = 2;
  string           display_name       = 3;
  uint32           grid_width         = 4;  // Rust u8
  uint32           grid_height        = 5;  // Rust u8
  double           weight             = 6;
  string           rarity             = 7;  // common/uncommon/rare/epic/legendary/ancient
  string           description        = 8;
  uint64           stack_count        = 9;
  double           spirit_quality     = 10;
  double           durability         = 11;
  optional string  mineral_id         = 12;
  optional string  scroll_kind        = 13;
  optional string  scroll_skill_id    = 14;
  optional uint32  scroll_xp_grant    = 15;
  optional uint32  charges            = 16;
  optional float   forge_quality      = 17;
  optional ColorKind forge_color      = 18;
  repeated string  forge_side_effects = 19;
  optional uint32  forge_achieved_tier = 20;
}

message ContainerSnapshot {
  string id   = 1;
  string name = 2;
  uint32 rows = 3; // Rust u8
  uint32 cols = 4; // Rust u8
}

message PlacedInventoryItem {
  string            container_id = 1;
  uint64            row          = 2;
  uint64            col          = 3;
  InventoryItemView item         = 4;
}

message EquippedInventorySnapshot {
  optional InventoryItemView head           = 1;
  optional InventoryItemView chest          = 2;
  optional InventoryItemView legs           = 3;
  optional InventoryItemView feet           = 4;
  optional InventoryItemView false_skin     = 5;
  optional InventoryItemView main_hand      = 6;
  optional InventoryItemView off_hand       = 7;
  optional InventoryItemView two_hand       = 8;
  optional InventoryItemView treasure_belt_0 = 9;
  optional InventoryItemView treasure_belt_1 = 10;
  optional InventoryItemView treasure_belt_2 = 11;
  optional InventoryItemView treasure_belt_3 = 12;
  optional InventoryItemView back_pack      = 13;
  optional InventoryItemView waist_pouch    = 14;
  optional InventoryItemView chest_satchel  = 15;
  optional InventoryItemView extra_hand_0   = 16;
  optional InventoryItemView extra_hand_1   = 17;
}

message InventoryWeight {
  double current = 1;
  double max     = 2;
}

// hotbar 槽用 wrapper 表达 optional（proto3 repeated 不支持 optional element）。
message HotbarSlot {
  optional InventoryItemView item = 1;
}

message InventorySnapshot {
  uint64                      revision    = 1;
  repeated ContainerSnapshot  containers  = 2;
  repeated PlacedInventoryItem placed_items = 3;
  EquippedInventorySnapshot   equipped    = 4;
  repeated HotbarSlot         hotbar      = 5; // 固定 9 槽
  uint64                      bone_coins  = 6;
  InventoryWeight             weight      = 7;
  string                      realm       = 8;
  double                      qi_current  = 9;
  double                      qi_max      = 10;
  double                      body_level  = 11;
}

// ─── 9. CombatHudState ─────────────────────────────────────────
// 与 Rust CombatHudStateV1 精确对应。高频推送，尽量紧凑。

message DerivedAttrFlags {
  bool flying              = 1;
  bool phasing             = 2;
  bool tribulation_locked  = 3;
}

message CombatHudState {
  float          hp_percent      = 1;
  float          qi_percent      = 2;
  float          stamina_percent = 3;
  DerivedAttrFlags derived       = 4;
}

// ─── 10. KnockbackSync ────────────────────────────────────────
// 与 Rust KnockbackSyncV1 精确对应。含 optional collision_damage。

message KnockbackSync {
  double         distance_blocks            = 1;
  double         velocity_blocks_per_tick   = 2;
  uint32         duration_ticks             = 3;
  double         kinetic_energy             = 4;
  optional float collision_damage           = 5;
  uint32         chain_depth                = 6; // Rust u8
  bool           block_broken               = 7;
}

// ─── C2S payloads ──────────────────────────────────────────────

message SetMeridianTarget {
  MeridianId meridian = 1;
}

message BreakthroughRequest {
  // 无额外字段，仅触发。
}

// ═══════════════════════════════════════════════════════════════
// P2 B1 — 炼丹 S2C
// ═══════════════════════════════════════════════════════════════

// 与 Rust AlchemyFurnaceDataV1 精确对应。
message AlchemyFurnace {
  optional int32 pos_x   = 1; // Rust Option<(i32,i32,i32)> 拆三字段
  optional int32 pos_y   = 2;
  optional int32 pos_z   = 3;
  uint32 tier            = 4; // Rust u8
  double integrity       = 5;
  double integrity_max   = 6;
  string owner_name      = 7;
  bool   has_session     = 8;
}

// 与 Rust AlchemyStageHintV1 精确对应。
message AlchemyStageHint {
  uint32 at_tick   = 1;
  uint32 window    = 2;
  string summary   = 3;
  bool   completed = 4;
  bool   missed    = 5;
}

// 与 Rust AlchemySessionDataV1 精确对应。
message AlchemySession {
  optional string            recipe_id            = 1;
  bool                       active               = 2;
  uint32                     elapsed_ticks        = 3;
  uint32                     target_ticks         = 4;
  double                     temp_current         = 5;
  double                     temp_target          = 6;
  double                     temp_band            = 7;
  double                     qi_injected          = 8;
  double                     qi_target            = 9;
  string                     status_label         = 10;
  repeated AlchemyStageHint  stages               = 11;
  repeated string            interventions_recent = 12;
}

// 与 Rust AlchemyOutcomeForecastDataV1 精确对应。
message AlchemyOutcomeForecast {
  double perfect_pct  = 1;
  double good_pct     = 2;
  double flawed_pct   = 3;
  double waste_pct    = 4;
  double explode_pct  = 5;
  string perfect_note = 6;
  string good_note    = 7;
  string flawed_note  = 8;
}

// 与 Rust AlchemyOutcomeBucketV1 精确对应。
enum AlchemyOutcomeBucket {
  ALCHEMY_OUTCOME_BUCKET_UNSPECIFIED = 0;
  ALCHEMY_OUTCOME_BUCKET_PERFECT    = 1;
  ALCHEMY_OUTCOME_BUCKET_GOOD       = 2;
  ALCHEMY_OUTCOME_BUCKET_FLAWED     = 3;
  ALCHEMY_OUTCOME_BUCKET_WASTE      = 4;
  ALCHEMY_OUTCOME_BUCKET_EXPLODE    = 5;
}

// 与 Rust AlchemyOutcomeResolvedDataV1 精确对应。
message AlchemyOutcomeResolved {
  AlchemyOutcomeBucket bucket         = 1;
  optional string      recipe_id      = 2;
  optional string      pill           = 3;
  optional double      quality        = 4;
  optional double      toxin_amount   = 5;
  optional ColorKind   toxin_color    = 6;
  optional double      qi_gain        = 7;
  optional string      side_effect_tag = 8;
  bool                 flawed_path    = 9;
  optional double      damage         = 10;
  optional double      meridian_crack = 11;
}

// 与 Rust AlchemyRecipeEntryV1 精确对应。
message AlchemyRecipeEntry {
  string id           = 1;
  string display_name = 2;
  string body_text    = 3;
  string author       = 4;
  string era          = 5;
  uint32 max_known    = 6;
}

// 与 Rust AlchemyRecipeBookDataV1 精确对应。
message AlchemyRecipeBook {
  repeated AlchemyRecipeEntry learned = 1;
  uint32 current_index               = 2;
}

// 与 Rust AlchemyContaminationLevelV1 精确对应。
message AlchemyContaminationLevel {
  ColorKind color   = 1;
  double    current = 2;
  double    max     = 3;
  bool      ok      = 4;
}

// 与 Rust AlchemyContaminationDataV1 精确对应。
message AlchemyContamination {
  repeated AlchemyContaminationLevel levels = 1;
  string metabolism_note                    = 2;
}

// ═══════════════════════════════════════════════════════════════
// P2 B1 — 炼丹 C2S
// ═══════════════════════════════════════════════════════════════

// 与 Rust ClientRequestV1::AlchemyOpenFurnace 精确对应。
// furnace_pos 是 Rust (i32,i32,i32) tuple → 拆成三字段。
message AlchemyOpenFurnace {
  int32 furnace_pos_x = 1;
  int32 furnace_pos_y = 2;
  int32 furnace_pos_z = 3;
}

// 与 Rust ClientRequestV1::AlchemyFeedSlot 精确对应。
message AlchemyFeedSlot {
  int32  furnace_pos_x = 1;
  int32  furnace_pos_y = 2;
  int32  furnace_pos_z = 3;
  uint32 slot_idx      = 4; // Rust u8
  string material      = 5;
  uint32 count         = 6;
}

// 与 Rust ClientRequestV1::AlchemyTakeBack 精确对应。
message AlchemyTakeBack {
  int32  furnace_pos_x = 1;
  int32  furnace_pos_y = 2;
  int32  furnace_pos_z = 3;
  uint32 slot_idx      = 4; // Rust u8
}

// 与 Rust ClientRequestV1::AlchemyIgnite 精确对应。
message AlchemyIgnite {
  int32  furnace_pos_x = 1;
  int32  furnace_pos_y = 2;
  int32  furnace_pos_z = 3;
  string recipe_id     = 4;
}

// 与 Rust AlchemyInterventionV1 精确对应 — tagged union。
message AlchemyInterventionProto {
  oneof kind {
    double adjust_temp     = 1; // AdjustTemp { temp }
    double inject_qi       = 2; // InjectQi { qi }
    string auto_profile_id = 3; // AutoProfile { profile_id }
  }
}

// 与 Rust ClientRequestV1::AlchemyIntervention 精确对应。
message AlchemyIntervention {
  int32                    furnace_pos_x = 1;
  int32                    furnace_pos_y = 2;
  int32                    furnace_pos_z = 3;
  AlchemyInterventionProto intervention  = 4;
}

// 与 Rust ClientRequestV1::AlchemyTurnPage 精确对应。
message AlchemyTurnPage {
  int32 delta = 1;
}

// 与 Rust ClientRequestV1::AlchemyLearnRecipe 精确对应。
message AlchemyLearnRecipe {
  string recipe_id = 1;
}

// 与 Rust ClientRequestV1::AlchemyLearnRecipeFragment 精确对应。
message AlchemyLearnRecipeFragment {
  uint64 item_instance_id = 1;
}

// 与 Rust ClientRequestV1::AlchemyTakePill 精确对应。
message AlchemyTakePill {
  string pill_item_id = 1;
}

// ═══════════════════════════════════════════════════════════════
// P2 B1 — 锻造 S2C
// ═══════════════════════════════════════════════════════════════

// 与 Rust WeaponForgeStationDataV1 精确对应。
message ForgeStation {
  string station_id  = 1;
  uint32 tier        = 2; // Rust u8
  float  integrity   = 3;
  string owner_name  = 4;
  bool   has_session = 5;
}

// 与 Rust ForgeStepV1 精确对应。
enum ForgeStep {
  FORGE_STEP_UNSPECIFIED  = 0;
  FORGE_STEP_BILLET       = 1;
  FORGE_STEP_TEMPERING    = 2;
  FORGE_STEP_INSCRIPTION  = 3;
  FORGE_STEP_CONSECRATION = 4;
  FORGE_STEP_DONE         = 5;
}

// 与 Rust TemperBeatV1 精确对应。
enum TemperBeat {
  TEMPER_BEAT_UNSPECIFIED = 0;
  TEMPER_BEAT_LIGHT       = 1; // "L"
  TEMPER_BEAT_HEAVY       = 2; // "H"
  TEMPER_BEAT_FOLD        = 3; // "F"
}

// 与 Rust ForgeOutcomeBucketV1 精确对应。
enum ForgeOutcomeBucket {
  FORGE_OUTCOME_BUCKET_UNSPECIFIED = 0;
  FORGE_OUTCOME_BUCKET_PERFECT    = 1;
  FORGE_OUTCOME_BUCKET_GOOD       = 2;
  FORGE_OUTCOME_BUCKET_FLAWED     = 3;
  FORGE_OUTCOME_BUCKET_WASTE      = 4;
  FORGE_OUTCOME_BUCKET_EXPLODE    = 5;
}

// 材料 kv 对：Rust (String, u32) tuple。
message ForgeMaterialPair {
  string material = 1;
  uint32 count    = 2;
}

// 与 Rust ForgeStepStateDataV1 精确对应 — tagged union by step。
// proto oneof 拆为 5 variant message。
message ForgeStepStateBillet {
  repeated ForgeMaterialPair materials_in = 1;
  optional string            active_carrier       = 2;
  uint32                     resolved_tier_cap    = 3;
}

message ForgeStepStateTempering {
  repeated TemperBeat pattern     = 1;
  uint32              beat_cursor = 2;
  uint32              hits        = 3;
  uint32              misses      = 4;
  uint32              deviation   = 5;
  double              qi_spent    = 6;
}

message ForgeStepStateInscription {
  uint32 filled_slots = 1;
  uint32 max_slots    = 2;
  bool   failed       = 3;
}

message ForgeStepStateConsecration {
  double           qi_injected    = 1;
  double           qi_required    = 2;
  optional ColorKind color_imprint = 3;
}

message ForgeStepState {
  oneof state {
    ForgeStepStateBillet       billet       = 1;
    ForgeStepStateTempering    tempering    = 2;
    ForgeStepStateInscription  inscription  = 3;
    ForgeStepStateConsecration consecration = 4;
    bool                       none_state   = 5; // ForgeStepStateDataV1::None
  }
}

// 与 Rust ForgeSessionDataV1 精确对应。
message ForgeSessionData {
  uint64         session_id     = 1;
  string         blueprint_id   = 2;
  string         blueprint_name = 3;
  bool           active         = 4;
  ForgeStep      current_step   = 5;
  uint32         step_index     = 6;
  uint32         achieved_tier  = 7;
  ForgeStepState step_state     = 8;
}

// 与 Rust ForgeOutcomeDataV1 精确对应。
message ForgeOutcome {
  uint64             session_id    = 1;
  string             blueprint_id  = 2;
  ForgeOutcomeBucket bucket        = 3;
  optional string    weapon_item   = 4;
  float              quality       = 5;
  optional ColorKind color         = 6;
  repeated string    side_effects  = 7;
  uint32             achieved_tier = 8;
  bool               flawed_path   = 9;
}

// 与 Rust ForgeBlueprintEntryV1 精确对应。
message ForgeBlueprintEntry {
  string id           = 1;
  string display_name = 2;
  uint32 tier_cap     = 3; // Rust u8
  uint32 step_count   = 4;
}

// 与 Rust ForgeBlueprintBookDataV1 精确对应。
message ForgeBlueprintBook {
  repeated ForgeBlueprintEntry learned = 1;
  uint32 current_index                 = 2;
}

