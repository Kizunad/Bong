// 与 Rust BotanyHarvestModeV1 精确对应。
enum BotanyHarvestMode {
  BOTANY_HARVEST_MODE_UNSPECIFIED = 0;
  BOTANY_HARVEST_MODE_MANUAL      = 1;
  BOTANY_HARVEST_MODE_AUTO        = 2;
}

// 与 Rust BotanyModelOverlayV1 精确对应。
enum BotanyModelOverlay {
  BOTANY_MODEL_OVERLAY_UNSPECIFIED = 0;
  BOTANY_MODEL_OVERLAY_NONE        = 1;
  BOTANY_MODEL_OVERLAY_EMISSIVE    = 2;
  BOTANY_MODEL_OVERLAY_DUAL_PHASE  = 3;
}

// ServerDataPayloadV1::BotanyHarvestProgress inline variant 精确对应。
message BotanyHarvestProgress {
  string          session_id       = 1;
  string          target_id        = 2;
  string          target_name      = 3;
  string          plant_kind       = 4;
  string          mode             = 5; // Rust String ("manual"/"auto")
  double          progress         = 6;
  bool            auto_selectable  = 7;
  bool            request_pending  = 8;
  bool            interrupted      = 9;
  bool            completed        = 10;
  string          detail           = 11;
  repeated string hazard_hints     = 12;
  optional double target_pos_x     = 13; // Rust Option<[f64;3]> 拆三字段
  optional double target_pos_y     = 14;
  optional double target_pos_z     = 15;
}

// 与 Rust BotanyPlantV2RenderProfileV1 精确对应。
message BotanyPlantV2RenderProfile {
  string           plant_id             = 1;
  string           base_mesh_ref        = 2;
  uint32           tint_rgb             = 3;
  optional uint32  tint_rgb_secondary   = 4;
  BotanyModelOverlay model_overlay      = 5;
}

message BotanyPlantV2RenderProfiles {
  repeated BotanyPlantV2RenderProfile profiles = 1;
}

// ServerDataPayloadV1::BotanySkill inline variant 精确对应。
message BotanySkill {
  uint64 level              = 1;
  uint64 xp                 = 2;
  uint64 xp_to_next_level   = 3;
  uint64 auto_unlock_level  = 4;
}

