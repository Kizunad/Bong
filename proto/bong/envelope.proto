// ═══════════════════════════════════════════════════════════════
// P2 B1 — 工坊合成 S2C
// ═══════════════════════════════════════════════════════════════

// 与 Rust CraftCategoryV1 精确对应。
enum CraftCategory {
  CRAFT_CATEGORY_UNSPECIFIED   = 0;
  CRAFT_CATEGORY_ANQI_CARRIER  = 1;
  CRAFT_CATEGORY_DUGU_POTION   = 2;
  CRAFT_CATEGORY_TUIKE_SKIN    = 3;
  CRAFT_CATEGORY_ZHENFA_TRAP   = 4;
  CRAFT_CATEGORY_TOOL          = 5;
  CRAFT_CATEGORY_ARMOR_CRAFT   = 6;
  CRAFT_CATEGORY_CONTAINER     = 7;
  CRAFT_CATEGORY_POISON_POWDER = 8;
  CRAFT_CATEGORY_MISC          = 9;
}

// 与 Rust CraftFailureReasonV1 精确对应。
enum CraftFailureReason {
  CRAFT_FAILURE_REASON_UNSPECIFIED     = 0;
  CRAFT_FAILURE_REASON_PLAYER_CANCELLED = 1;
  CRAFT_FAILURE_REASON_PLAYER_DIED     = 2;
  CRAFT_FAILURE_REASON_INTERNAL_ERROR  = 3;
}

// 与 Rust InsightTriggerV1 精确对应。
enum InsightTrigger {
  INSIGHT_TRIGGER_UNSPECIFIED     = 0;
  INSIGHT_TRIGGER_BREAKTHROUGH    = 1;
  INSIGHT_TRIGGER_NEAR_DEATH      = 2;
  INSIGHT_TRIGGER_DEFEAT_STRONGER = 3;
}

// 材料 kv 对：(template_id, count)。
message CraftMaterialPair {
  string template_id = 1;
  uint32 count       = 2;
}

// 产出 kv 对：(template_id, count)。
message CraftOutputPair {
  string template_id = 1;
  uint32 count       = 2;
}

// 真元色门槛 kv 对：(color_kind, min_share)。
message QiColorMinPair {
  ColorKind color     = 1;
  float     min_share = 2;
}

// 与 Rust CraftRequirementsV1 精确对应。
message CraftRequirements {
  optional Realm        realm_min    = 1;
  optional QiColorMinPair qi_color_min = 2;
  optional uint32       skill_lv_min = 3; // Rust u8
}

// 与 Rust CraftRecipeEntryV1 精确对应。
message CraftRecipeEntry {
  string                     id           = 1;
  CraftCategory              category     = 2;
  string                     display_name = 3;
  repeated CraftMaterialPair materials    = 4;
  double                     qi_cost      = 5;
  uint64                     time_ticks   = 6;
  CraftOutputPair            output       = 7;
  CraftRequirements          requirements = 8;
  bool                       unlocked     = 9;
}

// 与 Rust RecipeListV1 精确对应。
message CraftRecipeList {
  uint32                    v         = 1; // Rust u8
  string                    player_id = 2;
  repeated CraftRecipeEntry recipes   = 3;
  uint64                    ts        = 4;
}

// 与 Rust CraftSessionStateV1 精确对应。
message CraftSessionState {
  uint32          v               = 1; // Rust u8
  string          player_id       = 2;
  bool            active          = 3;
  optional string recipe_id       = 4;
  uint64          elapsed_ticks   = 5;
  uint64          total_ticks     = 6;
  uint32          completed_count = 7;
  uint32          total_count     = 8;
  uint64          ts              = 9;
}

// 与 Rust UnlockEventSourceV1 精确对应 — tagged union。
message UnlockEventSource {
  oneof source {
    string         scroll_item_template = 1;
    string         mentor_npc_archetype = 2;
    InsightTrigger insight_trigger      = 3;
  }
}

// 与 Rust CraftOutcomeV1 精确对应 — Completed / Failed variants。
message CraftOutcome {
  oneof outcome {
    CraftOutcomeCompleted completed = 1;
    CraftOutcomeFailed    failed    = 2;
  }
}

message CraftOutcomeCompleted {
  uint32 v                = 1; // Rust u8
  string player_id        = 2;
  string recipe_id        = 3;
  string output_template  = 4;
  uint32 output_count     = 5;
  uint64 completed_at_tick = 6;
  uint64 ts               = 7;
}

message CraftOutcomeFailed {
  uint32             v                 = 1; // Rust u8
  string             player_id        = 2;
  string             recipe_id        = 3;
  CraftFailureReason reason           = 4;
  uint32             material_returned = 5;
  double             qi_refunded      = 6;
  uint64             ts               = 7;
}

// 与 Rust RecipeUnlockedV1 精确对应。
message RecipeUnlocked {
  uint32            v               = 1; // Rust u8
  string            player_id       = 2;
  string            recipe_id       = 3;
  UnlockEventSource source          = 4;
  uint64            unlocked_at_tick = 5;
  uint64            ts              = 6;
}

