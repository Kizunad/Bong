// ═══════════════════════════════════════════════════════════════
// P2 B2 — 战斗 / 伤口 / 防御 / 施法 S2C
// ═══════════════════════════════════════════════════════════════

// 与 Rust WoundEntryV1 精确对应。
message WoundEntry {
  string part           = 1;
  string kind           = 2;
  float  severity       = 3;
  string state          = 4; // "stable" / "bleeding" / "healing" / "scarred"
  float  infection      = 5;
  bool   scar           = 6;
  uint64 updated_at_ms  = 7;
}

// 与 Rust WoundsSnapshotV1 精确对应。
message WoundsSnapshot {
  repeated WoundEntry wounds = 1;
}

// 与 Rust DefenseWindowV1 精确对应。
message DefenseWindow {
  uint32 duration_ms     = 1;
  uint64 started_at_ms   = 2;
  uint64 expires_at_ms   = 3;
}

// 与 Rust CastPhaseV1 精确对应。
enum CastPhase {
  CAST_PHASE_UNSPECIFIED = 0;
  CAST_PHASE_IDLE        = 1;
  CAST_PHASE_CASTING     = 2;
  CAST_PHASE_COMPLETE    = 3;
  CAST_PHASE_INTERRUPT   = 4;
}

// 与 Rust CastOutcomeV1 精确对应。
enum CastOutcome {
  CAST_OUTCOME_UNSPECIFIED          = 0;
  CAST_OUTCOME_NONE                 = 1;
  CAST_OUTCOME_COMPLETED            = 2;
  CAST_OUTCOME_INTERRUPT_MOVEMENT   = 3;
  CAST_OUTCOME_INTERRUPT_CONTAM     = 4;
  CAST_OUTCOME_INTERRUPT_CONTROL    = 5;
  CAST_OUTCOME_USER_CANCEL          = 6;
  CAST_OUTCOME_DEATH                = 7;
}

// 与 Rust CastSyncV1 精确对应。
message CastSync {
  CastPhase   phase          = 1;
  uint32      slot           = 2; // Rust u8 (0..=8)
  uint32      duration_ms    = 3;
  uint64      started_at_ms  = 4;
  CastOutcome outcome        = 5;
}

// ═══════════════════════════════════════════════════════════════
// P2 B2 — 快捷栏 / 技能栏 / 功法 S2C
// ═══════════════════════════════════════════════════════════════

// 与 Rust QuickSlotEntryV1 精确对应。
message QuickSlotEntry {
  string item_id          = 1;
  string display_name     = 2;
  uint32 cast_duration_ms = 3;
  uint32 cooldown_ms      = 4;
  string icon_texture     = 5;
}

// QuickSlotConfigV1.slots 是 Vec<Option<QuickSlotEntryV1>>，
// proto3 repeated 不支持 optional element，用 wrapper。
message OptionalQuickSlotEntry {
  optional QuickSlotEntry entry = 1;
}

// 与 Rust QuickSlotConfigV1 精确对应。
message QuickSlotConfig {
  repeated OptionalQuickSlotEntry slots = 1; // 固定 9 槽
  repeated uint64 cooldown_until_ms     = 2; // 固定 9 个 cooldown 截止时间
}

// 与 Rust SkillBarEntryV1 精确对应 — tagged union (Item / Skill)。
message SkillBarEntryItem {
  string template_id      = 1;
  string display_name     = 2;
  uint32 cast_duration_ms = 3;
  uint32 cooldown_ms      = 4;
  string icon_texture     = 5;
}

message SkillBarEntrySkill {
  string skill_id         = 1;
  string display_name     = 2;
  uint32 cast_duration_ms = 3;
  uint32 cooldown_ms      = 4;
  string icon_texture     = 5;
}

message SkillBarEntry {
  oneof kind {
    SkillBarEntryItem  item  = 1;
    SkillBarEntrySkill skill = 2;
  }
}

// SkillBarConfigV1.slots 是 Vec<Option<SkillBarEntryV1>>，用 wrapper。
message OptionalSkillBarEntry {
  optional SkillBarEntry entry = 1;
}

// 与 Rust SkillBarConfigV1 精确对应。
message SkillBarConfig {
  repeated OptionalSkillBarEntry slots = 1; // 固定 9 槽
  repeated uint64 cooldown_until_ms    = 2;
}

// 与 Rust TechniqueRequiredMeridianV1 精确对应。
message TechniqueRequiredMeridian {
  string channel    = 1;
  float  min_health = 2;
}

// 与 Rust TechniqueEntryV1 精确对应。
message TechniqueEntry {
  string                          id                  = 1;
  string                          display_name        = 2;
  string                          grade               = 3;
  float                           proficiency         = 4;
  string                          proficiency_label   = 5;
  bool                            active              = 6;
  string                          description         = 7;
  string                          required_realm      = 8;
  repeated TechniqueRequiredMeridian required_meridians = 9;
  float                           qi_cost             = 10;
  float                           stamina_cost        = 11;
  uint32                          cast_ticks          = 12;
  uint32                          cooldown_ticks      = 13;
  float                           range               = 14;
}

// 与 Rust TechniquesSnapshotV1 精确对应。
message TechniquesSnapshot {
  repeated TechniqueEntry entries = 1;
}

// 与 Rust UnlocksSyncV1 精确对应。
message UnlocksSync {
  bool jiemai  = 1;
  bool tishi   = 2;
  bool jueling = 3;
}

// 与 Rust DerivedAttrsSyncV1 精确对应。
message DerivedAttrsSync {
  bool   flying                     = 1;
  float  flying_qi_remaining        = 2;
  uint64 flying_force_descent_at_ms = 3;
  bool   phasing                    = 4;
  uint64 phasing_until_ms           = 5;
  bool   tribulation_locked         = 6;
  string tribulation_stage          = 7;
  float  throughput_peak_norm       = 8;
  uint32 tuike_layers               = 9;  // Rust u8
  bool   vortex_active              = 10;
}

// 与 Rust EventChannelV1 精确对应。
enum EventChannel {
  EVENT_CHANNEL_UNSPECIFIED = 0;
  EVENT_CHANNEL_COMBAT      = 1;
  EVENT_CHANNEL_CULTIVATION = 2;
  EVENT_CHANNEL_WORLD       = 3;
  EVENT_CHANNEL_SOCIAL      = 4;
  EVENT_CHANNEL_SYSTEM      = 5;
}

// 与 Rust EventPriorityV1 精确对应。
enum EventPriority {
  EVENT_PRIORITY_UNSPECIFIED = 0;
  EVENT_PRIORITY_P0_CRITICAL = 1;
  EVENT_PRIORITY_P1_IMPORTANT = 2;
  EVENT_PRIORITY_P2_NORMAL   = 3;
  EVENT_PRIORITY_P3_VERBOSE  = 4;
}

// 与 Rust EventStreamPushV1 精确对应。
message EventStreamPush {
  EventChannel  channel       = 1;
  EventPriority priority      = 2;
  string        source_tag    = 3;
  string        text          = 4;
  uint32        color         = 5;
  uint64        created_at_ms = 6;
}

