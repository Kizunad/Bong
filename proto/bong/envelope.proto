  CRAFT_FAILURE_REASON_UNSPECIFIED     = 0;
  CRAFT_FAILURE_REASON_PLAYER_CANCELLED = 1;
  CRAFT_FAILURE_REASON_PLAYER_DIED     = 2;
  CRAFT_FAILURE_REASON_INTERNAL_ERROR  = 3;
}

