// 与 Rust QuickSlotEntryV1 精确对应。
message QuickSlotEntry {
  string item_id          = 1;
  string display_name     = 2;
  uint32 cast_duration_ms = 3;
  uint32 cooldown_ms      = 4;
  string icon_texture     = 5;
}

// QuickSlotConfigV1.slots 是 Vec<Option<QuickSlotEntryV1>>，
// proto3 repeated 不支持 optional element，用 wrapper。
message OptionalQuickSlotEntry {
  optional QuickSlotEntry entry = 1;
}

// 与 Rust QuickSlotConfigV1 精确对应。
message QuickSlotConfig {
  repeated OptionalQuickSlotEntry slots = 1; // 固定 9 槽
  repeated uint64 cooldown_until_ms     = 2; // 固定 9 个 cooldown 截止时间
}

// 与 Rust SkillBarEntryV1 精确对应 — tagged union (Item / Skill)。
message SkillBarEntryItem {
  string template_id      = 1;
  string display_name     = 2;
  uint32 cast_duration_ms = 3;
  uint32 cooldown_ms      = 4;
  string icon_texture     = 5;
}

message SkillBarEntrySkill {
  string skill_id         = 1;
  string display_name     = 2;
  uint32 cast_duration_ms = 3;
  uint32 cooldown_ms      = 4;
  string icon_texture     = 5;
}

message SkillBarEntry {
  oneof kind {
    SkillBarEntryItem  item  = 1;
    SkillBarEntrySkill skill = 2;
  }
}

// SkillBarConfigV1.slots 是 Vec<Option<SkillBarEntryV1>>，用 wrapper。
message OptionalSkillBarEntry {
  optional SkillBarEntry entry = 1;
}

// 与 Rust SkillBarConfigV1 精确对应。
message SkillBarConfig {
  repeated OptionalSkillBarEntry slots = 1; // 固定 9 槽
  repeated uint64 cooldown_until_ms    = 2;
}

