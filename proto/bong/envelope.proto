    AlchemyOpenFurnace        alchemy_open_furnace        = 3;
    AlchemyFeedSlot           alchemy_feed_slot           = 4;
    AlchemyTakeBack           alchemy_take_back           = 5;
    AlchemyIgnite             alchemy_ignite              = 6;
    AlchemyIntervention       alchemy_intervention        = 7;
    AlchemyTurnPage           alchemy_turn_page           = 8;
    AlchemyLearnRecipe        alchemy_learn_recipe        = 9;
    AlchemyLearnRecipeFragment alchemy_learn_recipe_fragment = 10;
    AlchemyTakePill           alchemy_take_pill           = 11;
    ForgeStartSession         forge_start_session         = 12;
    ForgeTemperingHit         forge_tempering_hit         = 13;
    ForgeInscriptionScroll    forge_inscription_scroll    = 14;
    ForgeConsecrationInject   forge_consecration_inject   = 15;
    ForgeStepAdvance          forge_step_advance          = 16;
    ForgeBlueprintTurnPage    forge_blueprint_turn_page   = 17;
    ForgeLearnBlueprint       forge_learn_blueprint       = 18;
    CraftStart                craft_start                 = 19;
    CraftCancel               craft_cancel                = 20;
    BotanyHarvestRequest      botany_harvest_request      = 21;
    LingtianStartTill         lingtian_start_till         = 22;
    LingtianStartRenew        lingtian_start_renew        = 23;
    LingtianStartPlanting     lingtian_start_planting     = 24;
    LingtianStartHarvest      lingtian_start_harvest      = 25;
    LingtianStartReplenish    lingtian_start_replenish    = 26;
    LingtianStartDrainQi      lingtian_start_drain_qi     = 27;
    MineralProbe              mineral_probe               = 28;
    // ─── P2 B2：战斗 / 暗器 / 技能栏 / 死亡 C2S ──────────────────
    Jiemai                    jiemai                      = 29;
    ChargeCarrier             charge_carrier              = 30;
    ThrowCarrier              throw_carrier               = 31;
    AnqiContainerSwitch       anqi_container_switch       = 32;
    UseQuickSlot              use_quick_slot              = 33;
    QuickSlotBind             quick_slot_bind             = 34;
    SkillBarCast              skill_bar_cast              = 35;
    SkillBarBind              skill_bar_bind              = 36;
    SkillConfigIntent         skill_config_intent         = 37;
    CombatReincarnate         combat_reincarnate          = 38;
    CombatTerminate           combat_terminate            = 39;
    CombatCreateNewCharacter  combat_create_new_character = 40;
    // ─── P2 B3：社交 / NPC / 身份 / 交易 / 领地 C2S ──────────
    SpiritNichePlace            spirit_niche_place            = 41;
    SpiritNicheGaze             spirit_niche_gaze             = 42;
    SpiritNicheMarkCoordinate   spirit_niche_mark_coordinate  = 43;
    SpiritNicheActivateGuardian spirit_niche_activate_guardian = 44;
    SparringInviteResponse      sparring_invite_response      = 45;
    TradeOfferRequest           trade_offer_request           = 46;
    TradeOfferResponse          trade_offer_response          = 47;
    NpcInspectRequest           npc_inspect_request           = 48;
    NpcDialogueChoice           npc_dialogue_choice           = 49;
    NpcTradeRequest             npc_trade_request             = 50;
    // ─── P2 B4：天劫 / 死亡 / 突破 C2S ───────────────────────────
    StartDuXu                   start_du_xu                   = 51;
    AbortTribulation            abort_tribulation             = 52;
    HeartDemonDecision          heart_demon_decision          = 53;
    DuoSheRequest               duo_she_request               = 54;
    QiColorInspect              qi_color_inspect              = 55;
    UseLifeCore                 use_life_core                 = 56;
    // ─── P2 B5：杂项 C2S ────────────────────────────────────────────
    VoidAction                  void_action                   = 57;
    MovementActionRequest       movement_action               = 58;
    ForgeRequestC2s             forge_request                 = 59;
    InsightDecision             insight_decision              = 60;
    AlchemyFurnacePlace         alchemy_furnace_place         = 61;
    CoffinOpen                  coffin_open                   = 62;
    CoffinPlace                 coffin_place                  = 63;
    CoffinEnter                 coffin_enter                  = 64;
