  optional uint32       skill_lv_min = 3; // Rust u8
}

// 与 Rust CraftRecipeEntryV1 精确对应。
message CraftRecipeEntry {
  string                     id           = 1;
  CraftCategory              category     = 2;
  string                     display_name = 3;
  repeated CraftMaterialPair materials    = 4;
  double                     qi_cost      = 5;
  uint64                     time_ticks   = 6;
  CraftOutputPair            output       = 7;
  CraftRequirements          requirements = 8;
  bool                       unlocked     = 9;
}

// 与 Rust RecipeListV1 精确对应。
message CraftRecipeList {
  uint32                    v         = 1; // Rust u8
  string                    player_id = 2;
  repeated CraftRecipeEntry recipes   = 3;
  uint64                    ts        = 4;
}

// 与 Rust CraftSessionStateV1 精确对应。
message CraftSessionState {
  uint32          v               = 1; // Rust u8
  string          player_id       = 2;
  bool            active          = 3;
  optional string recipe_id       = 4;
  uint64          elapsed_ticks   = 5;
  uint64          total_ticks     = 6;
  uint32          completed_count = 7;
  uint32          total_count     = 8;
  uint64          ts              = 9;
}

// 与 Rust UnlockEventSourceV1 精确对应 — tagged union。
message UnlockEventSource {
  oneof source {
    string         scroll_item_template = 1;
    string         mentor_npc_archetype = 2;
    InsightTrigger insight_trigger      = 3;
  }
}

// 与 Rust CraftOutcomeV1 精确对应 — Completed / Failed variants。
message CraftOutcome {
  oneof outcome {
    CraftOutcomeCompleted completed = 1;
    CraftOutcomeFailed    failed    = 2;
  }
}

message CraftOutcomeCompleted {
  uint32 v                = 1; // Rust u8
  string player_id        = 2;
  string recipe_id        = 3;
  string output_template  = 4;
  uint32 output_count     = 5;
  uint64 completed_at_tick = 6;
  uint64 ts               = 7;
}

message CraftOutcomeFailed {
  uint32             v                 = 1; // Rust u8
  string             player_id        = 2;
  string             recipe_id        = 3;
  CraftFailureReason reason           = 4;
  uint32             material_returned = 5;
  double             qi_refunded      = 6;
  uint64             ts               = 7;
}

// 与 Rust RecipeUnlockedV1 精确对应。
message RecipeUnlocked {
  uint32            v               = 1; // Rust u8
  string            player_id       = 2;
  string            recipe_id       = 3;
  UnlockEventSource source          = 4;
  uint64            unlocked_at_tick = 5;
  uint64            ts              = 6;
}

