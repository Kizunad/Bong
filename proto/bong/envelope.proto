  INSIGHT_TRIGGER_DEFEAT_STRONGER = 3;
}

// 材料 kv 对：(template_id, count)。
message CraftMaterialPair {
  string template_id = 1;
  uint32 count       = 2;
}

// 产出 kv 对：(template_id, count)。
message CraftOutputPair {
  string template_id = 1;
  uint32 count       = 2;
}

