# CodeRabbit 只在被明确请求时评审，不再随 PR 打开自动触发。
#
# 这里存在两套评审：本仓库自己的中央评审（.github/workflows/review-next.yml，只认
# workflow_dispatch 与精确的 `/review-next` 评论）和 CodeRabbit 这个第三方 App。前者一直是
# 手动的，后者按默认配置在每个 PR 打开时自动跑，于是「这个 PR 被评审过了吗」有两个互相独立
# 又互不知情的答案，而 PR 页面上只看得出「有评论」。
#
# 把触发方式统一成手动，边界才是明确的：没有人主动要，就没有评审。需要时仍可在 PR 里评论
# `@coderabbitai review` 按需触发。
reviews:
  auto_review:
    enabled: false
