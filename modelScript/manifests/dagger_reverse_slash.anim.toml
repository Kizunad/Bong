# dagger_reverse_slash —— 「这条动作应该看得出什么」的人写清单。
#
# **招式在 v3 变了**：v2 是「自右上向左下斜斩」，2026-08-31 用户手摆的两端把它改成了
# **刃自胸前垂下 → 扫过正下方 → 向右后撕开**的反手撕。清单整个重写。
#
# 状态：草案（由实施方拟，等人工审核后才算数）。

name = "匕首反握撕斩"
beats = "t0 用户手摆的反握低架 → t2/t3 刃前探蓄势 → t4 扫过弧底 → t5 撕开 → t6 甩到最高最后 → t8 用户手摆的右后收势"

[[feature]]
