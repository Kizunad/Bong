iron_lit  = [98, 82, 74]
iron_spec = [142, 126, 114]
mud_mid   = [78, 58, 44]
mud_lit   = [116, 88, 66]
fire_deep = [158, 54, 18]
fire_mid  = [226, 128, 32]
fire_high = [255, 204, 88]

[features]
# 矿体互锁双瓣（泥岩与生铁）
mineral_lobes = { elements = ["lobe_", "nodule_", "back_"], must_show_in = ["FRONT", "SIDE_R"], min_px = { FRONT = 10000, SIDE_R = 10000 } }

# 纵贯深谷火脉
thermal_chasm_veins = { elements = ["chasm_", "vein_"], must_show_in = ["FRONT"], min_px = { FRONT = 2000 } }
