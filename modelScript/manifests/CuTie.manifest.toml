# 粗铁矿 CuTie —— 特征点名清单
#
# 特征来源：`cu_tie.png` 物品原画与深板岩粗铁矿方块：
# 1. mineral_lobes: 水滴卵形原矿互锁矿体（左瓣泥岩风化坡与右瓣深黑生铁金属断层）
# 2. thermal_chasm_veins: 沿中央咬合裂谷深陷纵贯的曲折金橙地热火脉网

facing = "+z"
mirror_x = 0.0
size = 260

[materials]
iron_void = [24, 18, 14]
