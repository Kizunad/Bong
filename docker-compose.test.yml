name: ${BONG_TEST_COMPOSE_PROJECT:-bong-test}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${BONG_TEST_REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
