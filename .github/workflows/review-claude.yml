name: Review (Claude)

# 触发规则：
# - PR 第一次创建(opened)自动跑一次。
# - 后续提交不自动跑；需要在 PR 评论 `/review` 才会再次触发。
# - workflow_dispatch 只作人工兜底。
#
# 引擎：.github/scripts/review-claude.mjs，用 claude CLI 走 shuaiapi 的 Anthropic 协议编排。
# 结构：4 个维度【串行】覆盖，每维度内【控方/辩方并行博弈】(initial+debate 两轮)。
# 模型：reviewer 用性价比 gpt-5.6-terra；唯一的“决策”步用 gpt-5.6-sol + ultra thinking。
# 硬并发：所有 claude 调用过全局信号量，上限被编译期常量 HARD_MAX_CONCURRENCY=3 钳死。
#
# codex 引擎(review.yml)保留，改由 `/review-codex` 手动触发，不再自动跑，避免双跑。
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要审核的 PR 号
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-claude-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review') &&
       !startsWith(github.event.comment.body, '/review-codex') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 暂存脚本 + 切到 PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRNUM: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          mkdir -p /tmp/rev
          cp .github/scripts/review-claude.mjs /tmp/rev/review-claude.mjs
          gh pr checkout "$PRNUM" \
            || echo "::warning::gh pr checkout 失败，review 将基于当前 checkout + PR diff 审核"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.207
          claude --version

      - name: Review (claude · 4 维串行 × 控辩并行博弈 + sol 决策)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          ANTHROPIC_BASE_URL: ${{ vars.REVIEW_CLAUDE_BASE_URL || 'https://api.shuaiapi.com' }}
          ANTHROPIC_API_KEY: ${{ secrets.REVIEW_CLAUDE_API_KEY || secrets.SHUAIAPI_API_KEY || secrets.HLOOL_API_KEY }}
          REVIEW_MODEL_REVIEWER: ${{ vars.REVIEW_MODEL_REVIEWER || 'gpt-5.6-terra' }}
          REVIEW_MODEL_DECISION: ${{ vars.REVIEW_MODEL_DECISION || 'gpt-5.6-sol' }}
          REVIEW_MAX_DIFF: ${{ vars.REVIEW_MAX_DIFF || '40000' }}
          REVIEW_MAX_PLAN: ${{ vars.REVIEW_MAX_PLAN || '20000' }}
          REVIEW_CLAUDE_TIMEOUT_MS: ${{ vars.REVIEW_CLAUDE_TIMEOUT_MS || '900000' }}
          # 硬并发：脚本内 HARD_MAX_CONCURRENCY=3 钳死，此处只能往下调。
          REVIEW_CONCURRENCY: ${{ vars.REVIEW_CONCURRENCY || '2' }}
          REVIEW_DECISION_THINKING_TOKENS: ${{ vars.REVIEW_DECISION_THINKING_TOKENS || '24000' }}
          # 关闭 claude CLI 的非必要联网/telemetry 与自动更新。
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::缺 REVIEW_CLAUDE_API_KEY / SHUAIAPI_API_KEY / HLOOL_API_KEY secret"
            exit 1
          fi
          node /tmp/rev/review-claude.mjs
