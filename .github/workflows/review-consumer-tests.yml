name: Review consumer tests

on:
  pull_request:
    paths:
      - .github/workflows/review-next.yml
      - .github/workflows/review-consumer-tests.yml
      - .github/review-policy/bong.v1.json
      - .github/scripts/review-consumer.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/review-next.yml
      - .github/workflows/review-consumer-tests.yml
      - .github/review-policy/bong.v1.json
      - .github/scripts/review-consumer.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          check-latest: false
      - name: Validate central review consumer contract
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/review-consumer.test.mjs
          node --test .github/scripts/review-consumer.test.mjs
          git diff --check
