name: Review consumer tests

on:
  pull_request:
    paths:
      - .github/workflows/review-next.yml
      - .github/workflows/review-provider-canary.yml
      - .github/workflows/review-consumer-tests.yml
      - .github/review-policy/bong.v2.json
      - .github/scripts/review-consumer.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/review-next.yml
      - .github/workflows/review-provider-canary.yml
      - .github/workflows/review-consumer-tests.yml
      - .github/review-policy/bong.v2.json
      - .github/scripts/review-consumer.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned central review contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Kizunad/review
          ref: a45c6a79cc1fe2ccf12fe0b64eb7f1bf017aaea6
          path: _central-contract
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned provider canary contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Kizunad/review
          ref: 9dcee849e3a0b45bd9a8fe663b48ae3fb1d82784
          path: 9dcee849e3a0b45bd9a8fe663b48ae3fb1d82784
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          check-latest: false
      - name: Install pinned Bubblewrap sandbox
        shell: bash
        env:
          BWRAP_URL: https://security.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.9.0-1ubuntu0.1_amd64.deb
          BWRAP_SHA256: 1b506492bd9c7fd0cdb4f02ac822f1d3e336b0aead5113c1239baf8db5db562a
        run: |
          set -euo pipefail
          mkdir -p _sandbox-package
          curl --fail-with-body --silent --show-error --location "$BWRAP_URL" -o _sandbox-package/bubblewrap.deb
          printf '%s  %s\n' "$BWRAP_SHA256" '_sandbox-package/bubblewrap.deb' | sha256sum --check --strict
          dpkg-deb --extract _sandbox-package/bubblewrap.deb _sandbox-package/root
          bwrap_executable="$GITHUB_WORKSPACE/_sandbox-package/root/usr/bin/bwrap"
          [[ -f "$bwrap_executable" && -x "$bwrap_executable" ]]
          [[ "$($bwrap_executable --version)" == 'bubblewrap 0.9.0' ]]
          sudo chown root:root "$bwrap_executable"
          sudo chmod 4755 "$bwrap_executable"
          [[ "$(stat -c '%U:%G %a' "$bwrap_executable")" == 'root:root 4755' ]]
          "$bwrap_executable" --unshare-all --share-net --die-with-parent --new-session \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --dev /dev --proc /proc --tmpfs /tmp -- /bin/true
          printf 'BWRAP_EXECUTABLE=%s\n' "$bwrap_executable" >> "$GITHUB_ENV"
      - name: Validate central review consumer contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C _central-contract rev-parse HEAD)" == 'a45c6a79cc1fe2ccf12fe0b64eb7f1bf017aaea6' ]]
          [[ "$(git -C 9dcee849e3a0b45bd9a8fe663b48ae3fb1d82784 rev-parse HEAD)" == '9dcee849e3a0b45bd9a8fe663b48ae3fb1d82784' ]]
          node --check .github/scripts/review-consumer.test.mjs
          CENTRAL_REVIEW_CONTRACT_DIR=_central-contract \
            PROVIDER_CANARY_CONTRACT_DIR=9dcee849e3a0b45bd9a8fe663b48ae3fb1d82784 \
            node --test .github/scripts/review-consumer.test.mjs
          (
            cd _central-contract
            npm test
          )
          git diff --check
