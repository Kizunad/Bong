# Manual trial caller for the v2 review engine.
#
# WHY THIS FILE HAS TO EXIST AT ALL
#
# v2 can be smoke-tested with `gh workflow run review-v2-p1.yml --repo Kizunad/review`, and that
# is how it was brought to its first verdict. But that dispatch runs in the ENGINE's repository,
# so every publish step's `${{ github.token }}` is scoped to Kizunad/review and cannot write to
# a Bong pull request. The engine repo holds no cross-repo PAT, and adding one would create a
# long-lived cross-repository credential that v2's own design criteria rule out.
#
# The publish leg is only reachable the way v1 already reaches it: CALLED FROM THIS REPOSITORY,
# where the token is Bong's and carries pull-requests: write. Hence this caller. It is
# workflow_dispatch ONLY - nothing here runs automatically, and review-next.yml remains the
# merge gate.
#
# THE ENGINE REF IS A BRANCH, NOT A PINNED SHA, AND THAT IS DELIBERATE BUT NOT FREE.
# review-next.yml pins Kizunad/review@<sha> because it is the gate. This one tracks the WIP
# branch, because the thing being trialled is the branch. That means the code it runs can change
# under you between two dispatches; the run log records the engine commit it resolved, and that
# is the record to quote when reporting a trial result. Do not promote this pattern to the gate.
name: review-v2-trial

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      engine_ref:
        description: 'engine branch/tag/sha (informational - the uses: ref below is fixed by GitHub at parse time)'
        required: false
        type: string
        default: 'feat/v2-review-crew'

jobs:
  # head_oid is resolved here rather than typed, because a hand-copied sha that has drifted from
  # the PR head produces a review that is bound to a commit nobody is looking at - and v2's
  # manifest binds the verdict to head_oid, so the mismatch surfaces late and looks like an
  # engine fault.
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      head_oid: ${{ steps.head.outputs.head_oid }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$PR" in
            ''|*[!0-9]*) echo "pr_number must be digits, got '$PR'" >&2; exit 1 ;;
          esac
          oid="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)"
          # A 40-hex assertion, not a non-empty check: `gh api --jq` prints "null" for a missing
          # field and exits 0, so "it returned something" is not "it returned a commit".
          case "$oid" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "refusing: PR $PR resolved to '$oid', which is not a commit sha" >&2; exit 1 ;;
          esac
          echo "PR $PR head is $oid"
          echo "head_oid=$oid" >> "$GITHUB_OUTPUT"

  review:
    needs: resolve
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    uses: Kizunad/review/.github/workflows/review-v2-p1.yml@feat/v2-review-crew
    with:
      repository: ${{ github.repository }}
      pull_number: ${{ inputs.pr_number }}
      head_oid: ${{ needs.resolve.outputs.head_oid }}
      # Same policy the gate uses. Without it v2 reviews but CANNOT publish, which is exactly
      # the leg this caller exists to exercise.
      policy_path: .github/review-policy/bong.v2.json
      review_base_url: ${{ vars.REVIEW_CLAUDE_BASE_URL || 'https://api.claudeopus.world' }}
      # A trial is a human reaching for it on purpose; that is the only trigger this bypass
      # applies to, and it keeps an open infrastructure circuit from blocking the trial itself.
      circuit_manual_retry: true
    secrets:
      review_api_key: ${{ secrets.REVIEW_CLAUDE_API_KEY }}
