name: Hive-Think Review

# 按需触发:在 PR 上评论 @hive(或 @hive-think)才跑。
# "hive-think" 不是单模型,而是 N× gpt-5.5 并行 debate(发现 → 对峙 → 总裁决)。
# 走免费 GPT-5.5 端点(限时羊毛),不计 token;与 @pi / @claude_workflow_review 并存互不干扰。
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要审核的 PR 号
        required: true

permissions:
  contents: read # 只读 token:agent 天然无法 merge / push
  pull-requests: write
  issues: write

concurrency:
  # 含 comment.id 且不取消进行中:避免同一 PR 上后续 bot 评论把正在跑的 review 杀掉
  group: hive-review-${{ github.event.issue.number || inputs.pr_number || github.run_id }}-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # 仅当 PR 评论里 @hive、且评论者有写权限(OWNER/MEMBER/COLLABORATOR)时运行——
    # public 仓库下防止任意访客评论 @hive 触发跑(虽是免费 key,也避免被刷)。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@hive') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 签出默认分支(main):脚本与 docs/plan-*.md 都来自 main——issue_comment 触发的 workflow
      # 本就只认 main 上的定义,而 PR head 分支里没有本脚本(会 MODULE_NOT_FOUND)。
      # PR 的真实改动由脚本内 `gh pr diff <PR>` 经 API 取,不依赖本地签出 PR 代码。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Hive-Think Review (严格多轮裁定)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          # 端点/模型/规模/裁定阈值都可被 repo variables / secrets 覆盖。
          # key 必须在 repo secrets 配 HIVE_API_KEY(SenseNova 端点需鉴权,无默认)。
          HIVE_BASE_URL: ${{ vars.HIVE_BASE_URL || 'https://token.sensenova.cn/v1' }}
          # 多 key 轮询:HIVE_API_KEY + HIVE_API_KEY_2 两个独立 secret 拼成逗号串,
          # 脚本按 round-robin 摊负载、失败自动切下一把。空 secret 会被脚本去空过滤掉。
          HIVE_API_KEYS: ${{ secrets.HIVE_API_KEY }},${{ secrets.HIVE_API_KEY_2 }}
          # 逗号分隔,finders + 投票者在这些模型间轮转,同台裁定
          HIVE_MODELS: ${{ vars.HIVE_MODELS || 'deepseek-v4-flash,sensenova-6.7-flash-lite' }}
          HIVE_ARBITER_MODEL: ${{ vars.HIVE_ARBITER_MODEL || 'deepseek-v4-flash' }}
          HIVE_SWARM_SIZE: ${{ vars.HIVE_SWARM_SIZE || '10' }}
          HIVE_CONCURRENCY: ${{ vars.HIVE_CONCURRENCY || '12' }}
          # 严格收敛(少而准):默认 NOT_REAL 投票者多轮裁定,接受/拒绝阈值 + 争议进下一轮 + top-N
          HIVE_VOTERS: ${{ vars.HIVE_VOTERS || '12' }}
          HIVE_ACCEPT_RATIO: ${{ vars.HIVE_ACCEPT_RATIO || '0.7' }}
          HIVE_REJECT_RATIO: ${{ vars.HIVE_REJECT_RATIO || '0.35' }}
          HIVE_MAX_VOTE_ROUNDS: ${{ vars.HIVE_MAX_VOTE_ROUNDS || '3' }}
          HIVE_TOP_N: ${{ vars.HIVE_TOP_N || '8' }}
        run: node .github/scripts/hive-review.mjs
