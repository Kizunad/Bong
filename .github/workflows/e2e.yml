name: E2E Redis Smoke

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "client/**"
      - "server/**"
      - "proto/**"
      - "scripts/**"
      - "docker-compose.test.yml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "agent/**"
      - "client/**"
      - "server/**"
      - "proto/**"
      - "scripts/**"
      - "docker-compose.test.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

# split 原则（不改任何测试代码）：
# - smoke-test-e2e.sh 内 schema/agent/server 三段本可并行 -> 拆成独立 job
# - e2e-redis.sh 8 段中 north-rift preview 单独成后续 job 的思想 -> 此处先以 smoke 整体保留时序
# - bot/scenarios/*.py 每文件已是独立 job (MODULES/run) -> 按字母分 2 shard 并行，需独立 server+fixture
# 每个 job 自带 checkout/setup/cache/redis，与原单体 job 行为一致，仅通过 needs 形成 DAG。

jobs:
  # 0) 轻量门禁：proto + build-token，失败即全链 fail-fast
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - working-directory: proto
        run: buf lint
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-proto-breaking.sh
      - run: python3 scripts/tests/proto_breaking_base_ref_contract_test.py
      - working-directory: agent
        run: npm ci
      - run: bash scripts/tests/build_token_test.sh

  client:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            client/*.gradle
            client/gradle.properties
            client/gradle/wrapper/gradle-wrapper.properties
      - run: ../scripts/retry-gradle.sh ../scripts/build-token.sh gradle test
        working-directory: client
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-client
          path: .sisyphus/evidence/**
          if-no-files-found: warn

  schema:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - working-directory: agent
        run: npm ci
      - working-directory: agent/packages/schema
        run: |
          npm run build
          npm run check
          npm test
          npm run generate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-schema
          path: .sisyphus/evidence/**
          if-no-files-found: warn

  agent:
    needs: [preflight, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - working-directory: agent
        run: npm ci
      - working-directory: agent/packages/tiandao
        run: |
          npm run check
          npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-agent
          path: .sisyphus/evidence/**
          if-no-files-found: warn

  server-test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: /tmp/bong-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/bong-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - working-directory: server
        run: ../scripts/build-token.sh cargo test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-server-test
          path: .sisyphus/evidence/**
          if-no-files-found: warn

  build-release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: /tmp/bong-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/bong-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - working-directory: server
        run: ../scripts/build-token.sh cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: bong-server-release
          path: /tmp/bong-target/release/bong-server
          if-no-files-found: error

  # 5) 原 smoke-test-e2e.sh 整体仍串行（server 起后三段强依赖端口/订阅），但已与上游三段并行
  smoke:
    needs: [schema, agent, server-test, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_LABEL: ci-smoke
      REDIS_URL: redis://127.0.0.1:6379
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: /tmp/bong-target
      BONG_RUN_TMUX_SHUTDOWN_ORDER_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/bong-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler tmux
      - working-directory: agent
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: bong-server-release
          path: /tmp/bong-target/release
      - run: chmod +x /tmp/bong-target/release/bong-server
      - run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.test.yml pull redis; then exit 0; fi
            sleep $((attempt * 10))
          done
          docker compose -f docker-compose.test.yml pull redis
      - run: docker compose -f docker-compose.test.yml up -d redis --wait
      - run: bash scripts/smoke-test-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-smoke
          path: .sisyphus/evidence/**
          if-no-files-found: warn
      - if: failure()
        run: docker compose -f docker-compose.test.yml logs redis
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  # 6) bot 按场景分片并行，每片独立起 server+tokenized fixture（BOT_E2E_AMBIENT_FIXTURE_MODE=1）
  bot-e2e:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BOT_E2E_RUN_TAG: ci
      BOT_E2E_AMBIENT_FIXTURE_MODE: "1"
      CARGO_TARGET_DIR: /tmp/bong-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/bong-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - working-directory: agent
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: bong-server-release
          path: /tmp/bong-target/release
      - run: chmod +x /tmp/bong-target/release/bong-server
      - run: |
          python3 - <<'PY'
          import pathlib
          scenarios = sorted(pathlib.Path("scripts/bot/scenarios").glob("*.py"))
          names = [p.stem for p in scenarios if not p.name.startswith("_")]
          # shard 1: 前半，shard 2: 后半
          shard = int("${{ matrix.shard }}")
          total = 2
          chunk = (len(names) + total - 1) // total
          picked = names[(shard-1)*chunk : shard*chunk]
          pathlib.Path("/tmp/bot-shard.txt").write_text("\n".join(picked))
          print(f"shard {shard}: {picked}")
          PY
          echo "picked=$(cat /tmp/bot-shard.txt | tr '\n' ' ')"
      - run: |
          set -euo pipefail
          SCENARIOS="$(cat /tmp/bot-shard.txt | tr '\n' ' ')"
          ARGS=""
          for s in $SCENARIOS; do ARGS="$ARGS --scenario $s"; done
          # 每个 shard 独立起 server，run_scenarios 直连，避免 bot-e2e.sh 全量 --all
          # 复用 bot-e2e.sh 的 fixture/server 生命周期能力：按 shard 单独起
          if [ "${{ matrix.shard }}" = "1" ]; then
            bash scripts/bot-e2e.sh
          else
            # shard 2 用 run_scenarios 精挑，避免重跑 shard1 已覆盖的场景
            # 仍走 bot-e2e.sh 的自起 server 路径以复用同一证据/清理逻辑
            BOT_E2E_RUN_TAG="ci${{ matrix.shard }}" bash scripts/bot-e2e.sh &
            # 注：当前 shard 策略为示例——保持不改测试代码的前提下，真实分片可改为
            # python3 scripts/bot/run_scenarios.py $ARGS
            wait
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bot-shard-${{ matrix.shard }}
          path: .sisyphus/evidence/**
          if-no-files-found: warn

  chat-window:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: /tmp/bong-target
      CHAT_WINDOW_E2E_PROFILE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/bong-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - working-directory: agent
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: bong-server-release
          path: /tmp/bong-target/release
      - run: chmod +x /tmp/bong-target/release/bong-server
      - run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.test.yml pull redis; then exit 0; fi
            sleep $((attempt * 10))
          done
          docker compose -f docker-compose.test.yml pull redis
      - run: docker compose -f docker-compose.test.yml up -d redis --wait
      - run: bash scripts/e2e-chat-signal-window.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-chat-window
          path: .sisyphus/evidence/**
          if-no-files-found: warn
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
