name: E2E Redis Smoke

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "client/**"
      - "server/**"
      - "proto/**"
      - "scripts/**"
      - "docker-compose.test.yml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "agent/**"
      - "client/**"
      - "server/**"
      - "proto/**"
      - "scripts/**"
      - "docker-compose.test.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_LABEL: ci
      REDIS_URL: redis://127.0.0.1:6379
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: /tmp/bong-target
      BONG_RUN_TMUX_SHUTDOWN_ORDER_TEST: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            agent/packages/schema/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            client/*.gradle
            client/gradle.properties
            client/gradle/wrapper/gradle-wrapper.properties

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler tmux

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            /tmp/bong-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Proto lint (buf)
        working-directory: proto
        run: buf lint

      - name: Proto breaking change check (buf)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-proto-breaking.sh

      - name: Proto breaking base-ref contract test
        run: python3 scripts/tests/proto_breaking_base_ref_contract_test.py

      - name: Install agent workspace dependencies
        working-directory: agent
        run: npm ci

      - name: Build-token contract
        run: bash scripts/tests/build_token_test.sh

      - name: Client stage (gradlew test)
        working-directory: client
        run: ../scripts/retry-gradle.sh ../scripts/build-token.sh gradle test

      - name: Pre-pull Redis image with retry
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.test.yml pull redis; then
              exit 0
            fi
            delay=$((attempt * 10))
            echo "redis image pull failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "${delay}"
          done
          docker compose -f docker-compose.test.yml pull redis

      - name: Bring up Redis test service
        run: docker compose -f docker-compose.test.yml up -d redis --wait

      - name: Schema stage (build + check + test + generate)
        working-directory: agent/packages/schema
        run: |
          npm run build
          npm run check
          npm test
          npm run generate

      - name: Agent stage (check + test)
        working-directory: agent/packages/tiandao
        run: |
          npm run check
          npm test

      - name: Build one sequential server release artifact
        id: server-release-artifact
        working-directory: server
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/bong-server-release"
          artifact_binary="$artifact_dir/bong-server"
          manifest="$artifact_dir/manifest.json"
          build_binary="${CARGO_TARGET_DIR:?}/release/bong-server"
          rm -rf -- "$artifact_dir"
          mkdir -p -- "$artifact_dir"
          ../scripts/build-token.sh cargo build --release
          test -f "$build_binary"
          test ! -L "$build_binary"
          install -m 700 "$build_binary" "$artifact_binary"
          chmod 400 "$artifact_binary"
          commit="${GITHUB_SHA:?GITHUB_SHA must be provided by GitHub Actions}"
          test "$(git rev-parse HEAD)" = "$commit"
          test -f "$artifact_binary"
          test ! -L "$artifact_binary"
          sha256="$(sha256sum "$artifact_binary" | awk '{print $1}')"
          python3 - "$manifest" "$artifact_binary" "$commit" "$sha256" <<'PY'
          import json
          import pathlib
          import sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "binary": str(pathlib.Path(sys.argv[2]).resolve(strict=True)),
              "commit": sys.argv[3],
              "profile": "release",
              "sha256": sys.argv[4],
          }, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 ../scripts/lib/bong_server_provenance.py check "$manifest" "$GITHUB_WORKSPACE"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "server release artifact commit=$commit sha256=$sha256 manifest=$manifest"

      - name: Server stage (build-token cargo test)
        working-directory: server
        run: ../scripts/build-token.sh cargo test

      - name: Smoke/E2E stage (Task 13 harness)
        env:
          RUN_LABEL: ci-smoke
        run: bash scripts/smoke-test-e2e.sh

      # AGENTS.md §15 —— 协议级黑盒玩家场景（复用同一份 provenance-checked sequential release artifact）
      - name: Bot e2e stage (protocol-level player scenarios)
        env:
          BOT_E2E_RUN_TAG: ci
          BOT_E2E_AMBIENT_FIXTURE_MODE: "1"
          BONG_E2E_PREBUILT_SERVER_MANIFEST: ${{ steps.server-release-artifact.outputs.manifest }}
        run: bash scripts/bot-e2e.sh

      - name: Bot fallback-flat e2e stage (spawn distribution coverage)
        env:
          BOT_E2E_RUN_TAG: ci
          BOT_E2E_FALLBACK_MODE: "1"
          BONG_E2E_PREBUILT_SERVER_MANIFEST: ${{ steps.server-release-artifact.outputs.manifest }}
        run: bash scripts/bot-e2e.sh

      - name: Bot chat timestamp → Tiandao window e2e
        env:
          CHAT_WINDOW_E2E_PROFILE: release
        run: bash scripts/e2e-chat-signal-window.sh

      - name: Upload e2e evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .sisyphus/evidence/**
          if-no-files-found: warn

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs redis

      - name: Tear down Redis test service
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
