name: Pi Plan-Aware Review

# 按需触发:在 PR 上评论 @pi 才跑。
#
# 引擎:确定性轮控脚本 .github/scripts/pi-review.mjs(自包含,只用 Node fetch + gh,无 npm 依赖)。
# 旧版用 pi-coding-agent-action + hive-think 扩展——那是个【无界 agent 循环】(pi -p 无轮数上限,
# 只在模型自己停手 / 30min 硬超时退出),一次 review 能烧 30+ 分钟。现改为脚本在外层做离散轮控:
#   第零步 gather(flash,1 次):diff + plan 压成紧凑 brief
#   第一步 debate 轮控(pro 面板 × 最多 PI_MAX_ROUNDS 轮):每轮单轮无工具调用(天生有界),
#     轮间注入倒计时+语气,面板自信度中位数 ≥ 阈值则提前收敛,到上限强制收口
#   低自信 fan-out:仍不达标且有弱项 → 每个弱维派一个专项成员并行深挖
#   第二步 arbiter:综合去重后的 findings 产出中文 review 并发评论
# 端点/模型/key/轮控参数全 env 可覆盖(repo variables / secrets)。
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要审核的 PR 号
        required: true

permissions:
  contents: read # 只读 token:reviewer 天然无法 merge / push
  pull-requests: write
  issues: write

concurrency:
  # 含 comment.id 且不取消进行中:避免同一 PR 上后续 bot 评论把正在跑的 review 杀掉
  group: pi-plan-review-${{ github.event.issue.number || inputs.pr_number || github.run_id }}-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # 仅当 PR 评论里 @pi、且评论者有写权限(OWNER/MEMBER/COLLABORATOR)时运行——
    # public 仓库下防止任意访客评论 @pi 触发跑、烧 key。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@pi') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # 轮控已使一切有界(面板并发 × ≤PI_MAX_ROUNDS 轮 + fan-out,单次调用 ≤PI_CALL_TIMEOUT_MS)。
    # 旧版 60min 是为无界 agent 循环兜底;现在 25min 绰绰有余,既是上限也是异常逃生阀。
    timeout-minutes: 25

    steps:
      # 签出默认分支(main):issue_comment 触发的 workflow 只认 main 上的定义,PR head 没有本脚本。
      # PR 真实改动由脚本内 `gh pr diff <PR>` 经 API 取;脚本读取的补充文件是 main 版本(prompt 已注明)。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pi Plan-Aware Review (确定性轮控)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          # 端点/模型/key 全可覆盖。默认走已验证可用的 SenseNova OpenAI 兼容端点 + deepseek-v4-* 模型名。
          PI_BASE_URL: ${{ vars.PI_BASE_URL || 'https://token.sensenova.cn/v1' }}
          # key 轮询:DEEPSEEK_API_KEY 打头、HIVE_API_KEY(_2) 兜底(同端点的不同羊毛 key),失败自动切下一把。
          PI_API_KEYS: ${{ secrets.DEEPSEEK_API_KEY }},${{ secrets.HIVE_API_KEY }},${{ secrets.HIVE_API_KEY_2 }}
          # 分层模型:gather 廉价 flash 压缩;debate 面板可混多模型(逗号分隔,成员循环取用)。
          # 待 deepseek-v4-pro 在端点上确认可用后,把 PI_DEBATE_MODELS 改成 'deepseek-v4-pro' 即升级 pro 档。
          PI_GATHER_MODEL: ${{ vars.PI_GATHER_MODEL || 'deepseek-v4-flash' }}
          PI_DEBATE_MODELS: ${{ vars.PI_DEBATE_MODELS || 'deepseek-v4-flash,sensenova-6.7-flash-lite,deepseek-v4-flash' }}
          PI_ARBITER_MODEL: ${{ vars.PI_ARBITER_MODEL || 'deepseek-v4-flash' }}
          # 轮控参数:面板 3 成员 × 最多 3 轮,自信度中位数 ≥80 提前收敛;低自信精准 fan-out ≤4 个弱维。
          PI_MAX_ROUNDS: ${{ vars.PI_MAX_ROUNDS || '3' }}
          PI_PANEL: ${{ vars.PI_PANEL || '3' }}
          PI_CONFIDENCE_TARGET: ${{ vars.PI_CONFIDENCE_TARGET || '80' }}
          PI_FANOUT_MAX: ${{ vars.PI_FANOUT_MAX || '4' }}
          PI_CONCURRENCY: ${{ vars.PI_CONCURRENCY || '6' }}
          PI_CALL_TIMEOUT_MS: ${{ vars.PI_CALL_TIMEOUT_MS || '300000' }}
        run: node .github/scripts/pi-review.mjs
