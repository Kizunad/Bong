name: Pi Plan-Aware Review

# 按需触发:在 PR 上评论 @pi 才跑。
#
# 引擎:确定性轮控脚本 .github/scripts/pi-review.mjs(自包含,只用 Node fetch + gh,无 npm 依赖)。
# 旧版用 pi-coding-agent-action + hive-think 扩展——那是个【无界 agent 循环】(pi -p 无轮数上限,
# 只在模型自己停手 / 30min 硬超时退出),一次 review 能烧 30+ 分钟。现改为脚本在外层做离散轮控:
#   动态分档:先按 diff 规模(变更行数+文件数)选档,定面板配比 + 轮数 + arbiter 档(小改省钱、大改力大砖飞)
#   第零步 gather(flash,1 次):diff + plan 压成紧凑 brief
#   第一步 debate 轮控(面板 × 最多 PI_MAX_ROUNDS 轮):每轮单轮无工具调用(天生有界),
#     轮间注入倒计时+语气,面板自信度中位数 ≥ 阈值则提前收敛,到上限强制收口
#   低自信 fan-out:仍不达标且有弱项 → 每个弱维派一个专项成员并行深挖
#   第二步 arbiter:综合去重后的 findings 产出中文 review 并发评论
# 多 provider 力大砖飞:模型名 `provider/id` 路由到各自端点/key/API 格式(OpenAI + Anthropic),
#   全走自家代理 proxy.kizun4.uk(免费):flash=deepseek-v4-flash、lite=sensenova-lite、pro=gpt-5.5。
#   某 provider 宕机/无 key → 自动跳过(graceful degrade),不阻断全局。
# 端点/模型/key/轮控参数全 env 可覆盖(repo variables / secrets)。
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要审核的 PR 号
        required: true

permissions:
  contents: read # 只读 token:reviewer 天然无法 merge / push
  pull-requests: write
  issues: write

concurrency:
  # 含 comment.id 且不取消进行中:避免同一 PR 上后续 bot 评论把正在跑的 review 杀掉
  group: pi-plan-review-${{ github.event.issue.number || inputs.pr_number || github.run_id }}-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # 仅当 PR 评论里 @pi、且评论者有写权限(OWNER/MEMBER/COLLABORATOR)时运行——
    # public 仓库下防止任意访客评论 @pi 触发跑、烧 key。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@pi') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # 动态分档:小改 6 成员/1 轮,大改力大砖飞 32 成员/2 轮,全走自家代理 proxy.kizun4.uk(免费)。每次调用 ≤PI_CALL_TIMEOUT_MS、
    # 轮数硬上限,所以仍有界;45min 是大面板的逃生阀(实测一次约 7-15min)。
    timeout-minutes: 45

    steps:
      # 签出默认分支(main):issue_comment 触发的 workflow 只认 main 上的定义,PR head 没有本脚本。
      # PR 真实改动由脚本内 `gh pr diff <PR>` 经 API 取;脚本读取的补充文件是 main 版本(prompt 已注明)。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pi Plan-Aware Review (多 provider 力大砖飞 + 确定性轮控)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          # 全走自家代理 proxy.kizun4.uk(脚本 cliproxy provider,key=server_agent via PI_CLIPROXY_KEY)。
          # 模型都汇总在此(deepseek-v4-flash + sensenova-lite + gpt-5.x),全免费、用量在代理侧统一统计。
          # proxy 上没有 deepseek-v4-pro,故 pro 档改用最强的 gpt-5.5(bench 实测比 deepseek-pro 还强)。
          # 其它 provider(deepseek/ollama/kiro/gemini…)registry 仍在脚本里,要用再配对应 PI_*_KEY 即可。
          PI_CLIPROXY_KEY: ${{ secrets.PI_CLIPROXY_KEY }}
          # 动态分档:按 diff 规模自动选面板配比 + 轮数(脚本 TIERS,均衡档):
          #   trivial ≤40 行 = flash4+lite2 / 1 轮 / 无 pro
          #   small   ≤250    = flash8+pro1+lite3 / 1 轮
          #   medium  ≤1000   = flash14+pro2+lite5 / 2 轮
          #   large   >1000   = flash20+pro4+lite8 / 2 轮(力大砖飞);文件≥15 升一档
          # 三档角色模型全在 proxy.kizun4.uk 上;arbiter 在有 pro 的档用 gpt-5.5、trivial 用免费 flash。
          PI_FLASH_MODEL: ${{ vars.PI_FLASH_MODEL || 'cliproxy/deepseek-v4-flash' }}
          PI_PRO_MODEL: ${{ vars.PI_PRO_MODEL || 'cliproxy/gpt-5.5' }}
          PI_LITE_MODEL: ${{ vars.PI_LITE_MODEL || 'cliproxy/sensenova-6.7-flash-lite' }}
          PI_GATHER_MODEL: ${{ vars.PI_GATHER_MODEL || 'cliproxy/deepseek-v4-flash' }}
          # 要钉死面板/轮数(关掉 autoscale 那一维)就设 vars.PI_DEBATE_MODELS / PI_MAX_ROUNDS / PI_ARBITER_MODEL;
          # 整体关掉 autoscale 设 vars.PI_AUTOSCALE=0。
          PI_CONFIDENCE_TARGET: ${{ vars.PI_CONFIDENCE_TARGET || '80' }}
          PI_FANOUT_MAX: ${{ vars.PI_FANOUT_MAX || '4' }}
          PI_CONCURRENCY: ${{ vars.PI_CONCURRENCY || '16' }}
          PI_CALL_TIMEOUT_MS: ${{ vars.PI_CALL_TIMEOUT_MS || '300000' }}
        run: node .github/scripts/pi-review.mjs
