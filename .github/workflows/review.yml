name: Review

# 触发规则（codex 为 PR 创建时的默认审核引擎；claude 引擎 review-claude.yml 已休眠，仅 /review-claude 手动）：
# - PR 第一次创建(opened)自动跑一次。
# - 后续提交不自动跑；需要在 PR 评论 `/review` 才会再次触发（含熔断旁路语义）。
# - workflow_dispatch 只作人工兜底。
#
# 引擎：.github/scripts/review.mjs 通过无 tools 的 Responses 请求编排 4 个 reviewer。
# 每个 reviewer 都使用 gpt-5.6-sol + high reasoning；模型进程没有 shell 或 GitHub 写令牌。
# 4 人首轮独立审查，随后读取同伴意见复投；只有 3/1 或 4/0 APPROVE 才算通过，2/2 视为未通过。
on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要审核的 PR 号
        required: true

permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.body == '/review' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      # 同源 PR 评论仍按 PR 资源授权；run 29062098910 已证明仅 issues:write 会返回 403。
      pull-requests: write
      # 创建并维护独立熔断状态 issue 及其事件评论。
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_run: ${{ steps.circuit.outputs.should_run }}
      circuit_outcome: ${{ steps.circuit.outcome }}

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: "24"

      - name: Review 熔断预检
        id: circuit
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          REVIEW_TRIGGER: ${{ github.event_name }}
          REVIEW_COMMENT_BODY: ${{ github.event.comment.body || '' }}
          REVIEW_INFRA_FAILURE_THRESHOLD: ${{ vars.REVIEW_INFRA_FAILURE_THRESHOLD || '3' }}
          REVIEW_INFRA_FAILURE_WINDOW_MINUTES: ${{ vars.REVIEW_INFRA_FAILURE_WINDOW_MINUTES || '60' }}
          REVIEW_CIRCUIT_MINUTES: ${{ vars.REVIEW_CIRCUIT_MINUTES || '60' }}
          REVIEW_GH_TIMEOUT_MS: ${{ vars.REVIEW_GH_TIMEOUT_MS || '30000' }}
        run: |
          mkdir -p /tmp/rev
          cp .github/scripts/review.mjs /tmp/rev/review.mjs
          node /tmp/rev/review.mjs circuit-preflight

  review:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      checkout_outcome: ${{ steps.checkout.outcome }}
      review_outcome: ${{ steps.review_run.outcome }}

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: "24"

      - name: 暂存可信 Review 脚本
        timeout-minutes: 3
        run: |
          mkdir -p /tmp/rev
          cp .github/scripts/review.mjs /tmp/rev/review.mjs

      - name: 切到并校验 PR head
        id: checkout
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRNUM: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          EXPECTED_HEAD="$(gh pr view "$PRNUM" --json headRefOid --jq '.headRefOid')"
          case "$EXPECTED_HEAD" in
            ""|*[!0-9a-f]*) echo "::error::PR headRefOid 非法：$EXPECTED_HEAD"; exit 1 ;;
          esac
          if [ "${#EXPECTED_HEAD}" -ne 40 ]; then
            echo "::error::PR headRefOid 长度非法：$EXPECTED_HEAD"
            exit 1
          fi
          gh pr checkout "$PRNUM" --detach
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::PR head 校验失败：expected=$EXPECTED_HEAD actual=$ACTUAL_HEAD"
            exit 1
          fi

      - name: Review (4× Codex gpt-5.6-sol high)
        id: review_run
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          REVIEW_CODEX_API_KEY: ${{ secrets.REVIEW_CODEX_API_KEY || secrets.REVIEW_CLAUDE_API_KEY || secrets.HLOOL_API_KEY || secrets.OPENAI_API_KEY || secrets.PI_CLIPROXY_KEY }}
          REVIEW_CODEX_BASE_URL: ${{ vars.REVIEW_CODEX_BASE_URL || 'https://oai.sb' }}
          REVIEW_CODEX_MODEL: ${{ vars.REVIEW_CODEX_MODEL || 'gpt-5.6-sol' }}
          REVIEW_MAX_DIFF: ${{ vars.REVIEW_MAX_DIFF || '40000' }}
          REVIEW_MAX_PLAN: ${{ vars.REVIEW_MAX_PLAN || '20000' }}
          REVIEW_CODEX_TIMEOUT_MS: ${{ vars.REVIEW_CODEX_TIMEOUT_MS || '900000' }}
          REVIEW_TOTAL_TIMEOUT_MINUTES: ${{ vars.REVIEW_TOTAL_TIMEOUT_MINUTES || '35' }}
          REVIEW_CODEX_CONCURRENCY: ${{ vars.REVIEW_CODEX_CONCURRENCY || '1' }}
          REVIEW_CODEX_RETRIES: ${{ vars.REVIEW_CODEX_RETRIES || '3' }}
          REVIEW_CODEX_RETRY_MS: ${{ vars.REVIEW_CODEX_RETRY_MS || '15000' }}
          REVIEW_INFRA_FAILURE_THRESHOLD: ${{ vars.REVIEW_INFRA_FAILURE_THRESHOLD || '3' }}
          REVIEW_INFRA_FAILURE_WINDOW_MINUTES: ${{ vars.REVIEW_INFRA_FAILURE_WINDOW_MINUTES || '60' }}
          REVIEW_CIRCUIT_MINUTES: ${{ vars.REVIEW_CIRCUIT_MINUTES || '60' }}
          REVIEW_GH_TIMEOUT_MS: ${{ vars.REVIEW_GH_TIMEOUT_MS || '30000' }}
          REVIEW_DEFER_COMMENT: "1"
          REVIEW_OUTCOME_FILE: /tmp/review-run-outcome.json
          REVIEW_COMMENT_FILE: /tmp/review.md
        run: node /tmp/rev/review.mjs

      - name: 上传 Review 结果
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: review-result-${{ github.run_id }}
          path: |
            /tmp/review-run-outcome.json
            /tmp/review.md
          if-no-files-found: ignore
          retention-days: 1

  finalize:
    needs: [preflight, review]
    if: >-
      always() &&
      needs.preflight.result != 'skipped' &&
      (needs.preflight.result != 'success' ||
       needs.preflight.outputs.circuit_outcome != 'success' ||
       needs.preflight.outputs.should_run == 'true')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: "24"

      - name: 下载 Review 结果
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: review-result-${{ github.run_id }}
          path: ${{ runner.temp }}/review-result

      - name: 汇总 Review 结果并执行降级
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          REVIEW_CIRCUIT_OUTCOME: ${{ needs.preflight.outputs.circuit_outcome || needs.preflight.result }}
          REVIEW_JOB_OUTCOME: ${{ needs.review.result || 'skipped' }}
          REVIEW_INSTALL_OUTCOME: success
          REVIEW_CONFIGURE_OUTCOME: success
          REVIEW_CHECKOUT_OUTCOME: ${{ needs.review.outputs.checkout_outcome || 'skipped' }}
          REVIEW_STEP_OUTCOME: ${{ needs.review.outputs.review_outcome || 'skipped' }}
          REVIEW_INFRA_FAILURE_THRESHOLD: ${{ vars.REVIEW_INFRA_FAILURE_THRESHOLD || '3' }}
          REVIEW_INFRA_FAILURE_WINDOW_MINUTES: ${{ vars.REVIEW_INFRA_FAILURE_WINDOW_MINUTES || '60' }}
          REVIEW_CIRCUIT_MINUTES: ${{ vars.REVIEW_CIRCUIT_MINUTES || '60' }}
          REVIEW_GH_TIMEOUT_MS: ${{ vars.REVIEW_GH_TIMEOUT_MS || '30000' }}
          REVIEW_DEFERRED_RESULT: "1"
          REVIEW_OUTCOME_FILE: ${{ runner.temp }}/review-result/review-run-outcome.json
          REVIEW_COMMENT_FILE: ${{ runner.temp }}/review-result/review.md
        run: node .github/scripts/review.mjs workflow-finalize
