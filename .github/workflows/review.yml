name: Review

# 触发规则：
# - PR 第一次创建(opened)自动跑一次。
# - 后续提交不自动跑；需要在 PR 评论 `/review` 才会再次触发。
# - workflow_dispatch 只作人工兜底。
#
# 引擎：.github/scripts/review.mjs 自包含编排 4 个 Codex reviewer。
# 每个 reviewer 都使用 gpt-5.6-sol + high reasoning，经 OpenAI-compatible Responses 端点。
# 4 人首轮独立审查，随后读取同伴意见复投；只有 3/1 或 4/0 APPROVE 才算通过，2/2 视为未通过。
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要审核的 PR 号
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 暂存脚本 + 切到 PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRNUM: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          mkdir -p /tmp/rev
          cp .github/scripts/review.mjs /tmp/rev/review.mjs
          gh pr checkout "$PRNUM" \
            || echo "::warning::gh pr checkout 失败，review 将基于当前 checkout + PR diff 审核"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Codex CLI
        run: |
          npm install -g @openai/codex@0.143.0
          codex --version

      - name: 配置 Codex hlool provider
        env:
          REVIEW_CODEX_API_KEY: ${{ secrets.REVIEW_CODEX_API_KEY || secrets.HLOOL_API_KEY || secrets.OPENAI_API_KEY || secrets.PI_CLIPROXY_KEY }}
          REVIEW_CODEX_BASE_URL: ${{ vars.REVIEW_CODEX_BASE_URL || 'https://api.hlool.top' }}
        run: |
          if [ -z "$REVIEW_CODEX_API_KEY" ]; then
            echo "::error::缺 REVIEW_CODEX_API_KEY / HLOOL_API_KEY / OPENAI_API_KEY secret"
            exit 1
          fi

          BASE="${REVIEW_CODEX_BASE_URL%/}"
          case "$BASE" in
            */v1) API_BASE="$BASE" ;;
            *) API_BASE="$BASE/v1" ;;
          esac

          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<EOF
          model_provider = "hlool"
          model = "gpt-5.6-sol"
          model_reasoning_effort = "high"
          disable_response_storage = true

          [model_providers.hlool]
          name = "hlool"
          wire_api = "responses"
          env_key = "REVIEW_CODEX_API_KEY"
          base_url = "${API_BASE}"
          EOF

      - name: Review (4× Codex gpt-5.6-sol high)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          REVIEW_CODEX_API_KEY: ${{ secrets.REVIEW_CODEX_API_KEY || secrets.HLOOL_API_KEY || secrets.OPENAI_API_KEY || secrets.PI_CLIPROXY_KEY }}
          REVIEW_CODEX_MODEL: ${{ vars.REVIEW_CODEX_MODEL || 'gpt-5.6-sol' }}
          REVIEW_MAX_DIFF: ${{ vars.REVIEW_MAX_DIFF || '40000' }}
          REVIEW_MAX_PLAN: ${{ vars.REVIEW_MAX_PLAN || '20000' }}
          REVIEW_CODEX_TIMEOUT_MS: ${{ vars.REVIEW_CODEX_TIMEOUT_MS || '900000' }}
          REVIEW_CODEX_CONCURRENCY: ${{ vars.REVIEW_CODEX_CONCURRENCY || '1' }}
          REVIEW_CODEX_RETRIES: ${{ vars.REVIEW_CODEX_RETRIES || '3' }}
          REVIEW_CODEX_RETRY_MS: ${{ vars.REVIEW_CODEX_RETRY_MS || '15000' }}
        run: node /tmp/rev/review.mjs
