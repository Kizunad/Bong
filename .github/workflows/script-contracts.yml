name: Script Contract Tests

on:
  push:
    branches:
      - main
    paths:
      - "scripts/tests/cargo_dev_profile_config_test.sh"
      - "scripts/tests/slot_registry_test.sh"
      - "scripts/tests/wt_janitor_test.sh"
      - "scripts/tests/preview_lifecycle_contract_test.sh"
      - "scripts/preview/run-server-headless.sh"
      - "scripts/preview/stop-server-headless.sh"
      - "scripts/lib/bong-server-lifecycle.sh"
      - "scripts/slot_registry.sh"
      - "scripts/wt-janitor.sh"
      - "server/.cargo/config.toml"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - ".github/workflows/script-contracts.yml"
  pull_request:
    paths:
      - "scripts/tests/cargo_dev_profile_config_test.sh"
      - "scripts/tests/slot_registry_test.sh"
      - "scripts/tests/wt_janitor_test.sh"
      - "scripts/tests/preview_lifecycle_contract_test.sh"
      - "scripts/preview/run-server-headless.sh"
      - "scripts/preview/stop-server-headless.sh"
      - "scripts/lib/bong-server-lifecycle.sh"
      - "scripts/slot_registry.sh"
      - "scripts/wt-janitor.sh"
      - "server/.cargo/config.toml"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - ".github/workflows/script-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-contracts:
    name: Shell contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust for cargo profile contract
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo dev profile config contract
        run: bash scripts/tests/cargo_dev_profile_config_test.sh

      - name: Slot registry contract
        run: bash scripts/tests/slot_registry_test.sh

      - name: Worktree janitor contract
        run: bash scripts/tests/wt_janitor_test.sh

      - name: Preview lifecycle contract
        # This harness owns the fake server, listener, authority-record, and
        # lock-race oracles for the headless preview start/stop lifecycle.
        run: bash scripts/tests/preview_lifecycle_contract_test.sh
