name: Claude PR Review

# 按需触发：在 PR 上评论 @claude 才跑。去掉了 opened/reopened/synchronize 自动触发——
# 每次 push 都重跑一个 10min 的 opus 多代理审核会持续吃 Claude 订阅额度。
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read # 只读 → agent 无法 merge PR 或 push（天然挡住，不靠工具白名单）
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  # 含 comment.id + 不取消进行中：否则同一 PR 上后续的 bot 评论(CodeRabbit/claude)
  # 会进同一组、用 cancel-in-progress 把正在跑的真 review 杀掉(实测 #388 踩到)。
  group: claude-review-${{ github.event.issue.number || github.run_id }}-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # 仅当 PR 评论里 @claude_workflow_review、且评论者有写权限（OWNER/MEMBER/COLLABORATOR）时运行。
    # 用独立触发词（不是裸 @claude）以免和通用 claude-mention.yml 响应器双触发。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude_workflow_review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head # issue_comment 默认 checkout base，这里取 PR head 才看得到真改动

      - name: Ensure ~/.local/bin exists for Claude Code CLI install
        run: mkdir -p "$HOME/.local/bin"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 放开权限让对抗式子代理(Task)和 gh 都能跑——全在 ephemeral runner 上，风险可控。
          # bypassPermissions = 允许全部，只用 --disallowedTools 禁掉文件改写；
          # merge/push 已被上面 permissions.contents:read 的 token 权限天然挡住，不必再禁。
          claude_args: >-
            --model claude-opus-4-8
            --permission-mode bypassPermissions
            --disallowedTools Write,Edit,MultiEdit,NotebookEdit
          prompt: |
            你是 Bong 项目 PR #${{ github.event.issue.number }} 的**总裁判——本次审核唯一的 opus**。
            用「发现 → 对峙 → 裁决」的对抗式多代理流程产出高质量审核,最后在 PR 上留**具体行内评论**。全程中文。

            ## 流程

            ### 1. 取 diff
            先 `gh pr diff ${{ github.event.issue.number }}` 拿到完整改动,通读改动范围,心里有数再分派。

            ### 2. 发现阶段(并发 sonnet)
            用 **review-finder** 子代理(Task 工具),**并发派出 5 个**,每个负责一个维度:
            `bug/正确性`、`安全`、`性能`、`架构一致性`、`世界观对齐`。
            review-finder 没有 gh,把**完整 diff 文本 + 它负责的维度**一起写进任务交给它(它会再 Read/Grep 仓库取上下文)。
            每个 finder 返回带 `file:line + 证据` 的 finding 列表。

            ### 3. 对峙阶段(haiku 唱反调)
            把上一步**每一条 finding** 交给 **review-skeptic** 子代理(haiku)尽力反驳。
            可并发派发。只保留 skeptic 判 `REAL` 的 finding,`NOT_REAL` 的丢弃。
            (finding 多时,可按文件/维度合并成几批交给数个 skeptic,但务必每条都被对峙过。)

            ### 4. 裁决与发布(你自己,opus)
            - 对**存活的 finding** 做最终判断——skeptic 也可能误杀或漏放,你有最终决定权,必要时可亲自核对代码
            - 对关键问题在 PR 上留**行内评论**(具体 file+行号),按 blocker/major/minor 标注
            - 末尾一条总结:整体评级(可合入 / 有阻塞)+ 阻塞项清单。
              整体没问题就一句「未发现阻塞性问题」+ 简短说明,**不要为凑数写评论**。

            ## 约束
            - **子代理不可用时(派生失败/被拒)**,不要空手而归:你自己逐维度审完并发布,保证降级也有结果。
            - 只报**真问题**且带证据,不要风格洁癖刷屏。
            - 审核重点(传给 finder,你裁决时也对照):
              1. **Bug 与正确性**:逻辑错误、边界、并发安全、错误分支/状态转换遗漏、IPC schema 对齐(TypeBox ↔ Rust serde 双端同步)
              2. **安全**:命令注入、反序列化、未校验外部输入
              3. **性能**:Rust 分配/克隆、Agent 端 Redis 调用频率、worldgen O(n²) 热路径
              4. **架构一致性**:CLAUDE.md 三层架构(server/agent/client)、LAYER_REGISTRY、Bevy ECS 数据/逻辑分离、新增 SkillRegistry::register 是否同步 declare 依赖经脉
              5. **世界观对齐**:境界(醒灵/引气/凝脉/固元/通灵/化虚)、骨币/灵石、灵气守恒律(真元流动必须走 qi_physics::QiTransfer)
