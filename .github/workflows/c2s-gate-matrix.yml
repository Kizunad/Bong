name: C2S Gate Matrix Contract

on:
  push:
    branches:
      - main
    paths:
      - "server/src/schema/client_request.rs"
      - "agent/packages/schema/src/**"
      - "agent/packages/schema/generated/**"
      - "agent/packages/schema/package.json"
      - "agent/packages/schema/tsconfig.json"
      - "agent/package.json"
      - "agent/package-lock.json"
      - "docs/plan-refactor-c2s-gate-v1.md"
      - "scripts/check_c2s_gate_matrix.py"
      - "scripts/tests/check_c2s_gate_matrix_test.py"
      - ".github/workflows/c2s-gate-matrix.yml"
  pull_request:
    paths:
      - "server/src/schema/client_request.rs"
      - "agent/packages/schema/src/**"
      - "agent/packages/schema/generated/**"
      - "agent/packages/schema/package.json"
      - "agent/packages/schema/tsconfig.json"
      - "agent/package.json"
      - "agent/package-lock.json"
      - "docs/plan-refactor-c2s-gate-v1.md"
      - "scripts/check_c2s_gate_matrix.py"
      - "scripts/tests/check_c2s_gate_matrix_test.py"
      - ".github/workflows/c2s-gate-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install schema dependencies
        working-directory: agent
        run: npm ci

      - name: Validate TypeBox source and generated schema
        working-directory: agent/packages/schema
        run: npm run check

      - name: Check C2S gate matrix contract
        run: |
          python3 scripts/check_c2s_gate_matrix.py
          python3 -m unittest discover -s scripts/tests -p 'check_c2s_gate_matrix_test.py'
