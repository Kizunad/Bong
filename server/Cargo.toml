[package]
name = "bong-server"
version = "0.1.0"
edition = "2021"

[features]
dev-techniques = []

[dependencies]
valence = { git = "https://github.com/valence-rs/valence", rev = "2b705351" }
# Direct dep purely to opt the shared valence_nbt instance into `preserve_order`
# (IndexMap-backed Compound, insertion order). plan-worldgen-v4 P5 nbt_io.rs needs
# byte-stable round-trips against scripts/nbt/nbt_builder.py, which writes fields
# in insertion order; the default BTreeMap-backed Compound sorts keys and breaks
# byte-identity. Cargo feature unification turns this on for the single shared
# valence_nbt 0.8.0 (same git rev), so valence's own usage benefits too. Key order
# is invisible to MC clients, so this is behaviour-neutral elsewhere.
valence_nbt = { git = "https://github.com/valence-rs/valence", rev = "2b705351", features = [
    "preserve_order",
] }
valence_command = { git = "https://github.com/valence-rs/valence", rev = "2b705351" }
valence_command_macros = { git = "https://github.com/valence-rs/valence", rev = "2b705351" }
big-brain = "0.21"
bevy_transform = "0.14.2"
pathfinding = "4"
seldom_state = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
redis = { version = "0.27", features = ["tokio-comp"] }
futures-util = "0.3"
memmap2 = "0.9"
flate2 = "1"
smallvec = "1"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
zstd = "0.13"
dotenvy = "0.15"
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
wiremock = "0.6"

[patch."https://github.com/valence-rs/valence"]
valence_generated = { path = "crates/valence_generated_bong" }
