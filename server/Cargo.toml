[package]
name = "bong-server"
version = "0.1.0"
edition = "2021"

# The module tree lives in the lib target so out-of-crate benches (criterion,
# worldgen-v4 §8.1 #10) can call real production code paths. The binary is a thin
# consumer of this lib.
[lib]
name = "bong_server"
path = "src/lib.rs"

[[bin]]
name = "bong-server"
path = "src/main.rs"

[[test]]
name = "pseudo_vein_runtime_unit"
path = "tests/unit/world/pseudo_vein_runtime_test.rs"

