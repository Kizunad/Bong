[features]
dev-techniques = []

[dependencies]
# Fork pin (Kizunad/valence @ 8eff652): Fix A for the viewer-count underflow in
# cleanup_chunks_after_client_despawn — join-tick OldPosition snap (valence_entity
# init_entities) leaves the first view diff empty, so a new client never incs
# pre-existing chunks; despawn cleanup then decs to 0 → debug panic / release
# u32::MAX wrap leak (loaded.rs dec_viewer_count). Guard must be LAZY: the first
# fix (39a4add0) used then_some(old - 1), whose argument is evaluated eagerly, so
# old - 1 still panicked in debug on old == 0; 8eff652 uses then(|| old - 1).
# Guarded decrement makes the orphan dec a no-op. Once merged upstream, rev flips
# back to valence-rs/valence.
valence = { git = "https://github.com/Kizunad/valence", rev = "8eff65296316ee145fd5efb8c6c10d6bcc9151c4" }
# Direct dep purely to opt the shared valence_nbt instance into `preserve_order`
# (IndexMap-backed Compound, insertion order). plan-worldgen-v4 P5 nbt_io.rs needs
# byte-stable round-trips against scripts/nbt/nbt_builder.py, which writes fields
# in insertion order; the default BTreeMap-backed Compound sorts keys and breaks
# byte-identity. Cargo feature unification turns this on for the single shared
# valence_nbt 0.8.0 (same git rev), so valence's own usage benefits too. Key order
# is invisible to MC clients, so this is behaviour-neutral elsewhere.
valence_nbt = { git = "https://github.com/Kizunad/valence", rev = "8eff65296316ee145fd5efb8c6c10d6bcc9151c4", features = [
    "preserve_order",
] }
valence_command = { git = "https://github.com/Kizunad/valence", rev = "8eff65296316ee145fd5efb8c6c10d6bcc9151c4" }
valence_command_macros = { git = "https://github.com/Kizunad/valence", rev = "8eff65296316ee145fd5efb8c6c10d6bcc9151c4" }
big-brain = "0.21"
bevy_transform = "0.14.2"
pathfinding = "4"
seldom_state = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
redis = { version = "0.27", features = ["tokio-comp"] }
futures-util = "0.3"
memmap2 = "0.9"
flate2 = "1"
smallvec = "1"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
zstd = "0.13"
dotenvy = "0.15"
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }

# worldgen-v4 §8.1 #10 — per-chunk generation budget (<25 ms target, 30 ms hard
# cap) + NBT decoration stamp memcpy micro-bench (<1 ms). Both drive the real lib
# code paths (column::fill_column / DecorationNbtRegistry::stamp).
[[bench]]
name = "chunk_generation"
harness = false

[[bench]]
name = "nbt_stamp"
harness = false

[patch."https://github.com/Kizunad/valence"]
valence_generated = { path = "crates/valence_generated_bong" }
