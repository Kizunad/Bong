# ── 1 经脉入门残卷（plan-scroll-reading-v1 P0，首入静默发放）──

[[item]]
id = "scroll_meridian_primer"
name = "《经脉浅述·残卷》"
category = "scroll"
grid_w = 1
grid_h = 2
base_weight = 0.05
rarity = "common"
spirit_quality_initial = 0.3
description = "残破的入门讲义，记述经脉通行之序。翻开可读。"
[item.readable_scroll]
title = "《经脉浅述·残卷》"
anim_id = "bong:read_scroll"
body_pages = [
  "第一页·总纲\n\n人身经脉二十条，正经十二，奇经八脉。真元循经而行——未通如涧中水，散而不汇；既通如江河，沛然归海。此卷不作图谱，只记通序、通难、通惑三事。执此残卷者，愿你我经脉终有一日相汇于江海。",
  "第二页·十二正经\n\n通经须循邻接之序：已通肺经，下一条必在大肠、心经之间择一，不可跳级。已通之经永不闭，唯可被打伤致用途折半——断经之剑手，古今皆废人。手三阴偏气利远，手三阳偏力利近，足三阴偏韧抗毒，足三阳偏速利闪。",
  "第三页·任督之要\n\n坊间常道任督既通境界自抬，此说过半虚妄。二脉虽居八奇经之首，独通不足以致通灵——须奇经通其四，方可冲通灵之门槛。任督真开通之效，唯真元调息速增约三成，非境界之抬。\n\n（后缺半页，字迹为水渍所毁）——原卷藏于青云残峰外门木箱，后人可往校补。",
]
