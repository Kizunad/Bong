plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
    id 'com.google.protobuf' version '0.9.4'
}

import groovy.json.JsonSlurper

group = 'com.bong.client'
version = '0.1.0'

repositories {
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://maven.wispforest.io/releases'
    }
    maven {
        name = "KosmX's maven"
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = "Felnull's maven"
        url = 'https://maven.felnull.dev/'
    }
    // GeckoLib 官方 maven（Cloudsmith）。同时托管 com.eliotlash.mclib，
    // 但 GeckoLib 自己已经 include 了 mclib，消费者无需单独依赖。
    maven {
        name = "GeckoLib"
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup "software.bernie.geckolib"
            includeGroup "com.eliotlash.mclib"
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "io.wispforest:owo-lib:${project.owo_version}"
    annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
    // PlayerAnimator by KosmX: 玩家骨骼动画库（纯客户端，服务端无需）
    // Maven: https://maven.kosmx.dev/dev/kosmx/player-anim/player-animation-lib-fabric/
    // include 把它 JarJar 进输出 jar，同时保证 dev runClient 能找到类
    include modImplementation("dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}")

    // bendy-lib by KosmX: player-animation 的 bend / bendDirection 轴实际靠这个 mod 的
    // BendableCuboid 顶点变形器来实现。不装它 PlayerAnimator 会悄悄退化成 DummyBendable
    // no-op——keyframe 仍会写进动画但渲染时完全没有弯折效果。Bong 的 buildFistPunchRight
    // 等动画对 bend 依赖严重（肘弯 115° / 膝弯 45° 都在 bend 轴），所以 depends 而非 suggests。
    // 同作者、同 maven、MIT；4.0.0 是 MC 1.20.1 唯一 tag 版本（见 Modrinth bendy-lib）。
    include modImplementation("io.github.kosmx.bendy-lib:bendy-lib-fabric:${project.bendy_lib_version}")

    // SpecialModelLoader (SML) by TeamFelNull: 通过 parent=sml:builtin/obj 拦截 item model
    // 加载链，让 vanilla ItemRenderer 直接吃 OBJ + MTL。Fabric 1.20.1 client-only，MIT。
    // 路径 X 加载器（docs/plan-weapon-v1.md §5.3）。include 把它 JarJar 进输出 jar。
    include modImplementation("dev.felnull:special-model-loader:${project.sml_version}")

    // GeckoLib 4.x by Gecko/Eliot/etc: Bedrock geo.json + animation.json 渲染 + 驱动框架，
    // 用于带骨骼链的复杂实体（鲸/龙等递归尾椎，PlayerAnimator 只动玩家骨骼覆盖不到）。
    // Maven artifact 名带 MC 版本：geckolib-fabric-1.20.1（同样的 group 在 1.20.4/1.20.6
    // 分支会发不同 artifact 名 geckolib-fabric-1.20.4），见 GeckoLib build.gradle archivesName。
    // mclib 已被 GeckoLib 自己 JarJar，consumer 不需要单独依赖。MIT。
    // include 把它 JarJar 进输出 jar，与现有 PlayerAnimator/SML 模式一致；如果以后想和
    // 其他装了 GeckoLib 的 mod 共存，应去掉 include 改成纯 modImplementation 让用户单装。
    include modImplementation("software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}")

    // protobuf-java: server↔client IPC protobuf codec（plan-protobuf-ipc-v1）
    // include 把它 JarJar 进输出 jar，Fabric 运行时无 protobuf
    include implementation('com.google.protobuf:protobuf-java:4.28.3')
    // protobuf-java-util: JsonFormat for proto→JSON bridge（plan-protobuf-ipc-v1 P3）
    include implementation('com.google.protobuf:protobuf-java-util:4.28.3')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// ─── Protobuf codegen（plan-protobuf-ipc-v1）──────────────────────
// proto 源在仓库根 proto/，server 和 client 共用。
protobuf {
    protoc {
        // protobuf-gradle-plugin 自动下载 protoc，无需系统安装。
        artifact = 'com.google.protobuf:protoc:4.28.3'
    }
}

sourceSets {
    main {
        proto {
            srcDir "${rootProject.projectDir}/../proto"
        }
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

loom {
    mods {
        'bong-client' {
            sourceSet sourceSets.main
        }
        'bong-client-gametest' {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gametest {
            server()
            source sourceSets.gametest
            property 'fabric-api.gametest'
            property 'fabric-api.gametest.report-file', file('build/gametest-results.xml').absolutePath
            property 'geckolib.disable_examples', 'true'
            runDir 'build/gametest'
        }
    }
}

def bongBlockManifest = file('../bong_blocks.json')
def generatedBongBlockDir = layout.buildDirectory.dir('generated/sources/bongBlocks/java')

tasks.register('generateBongBlockIds') {
    inputs.file(bongBlockManifest)
    outputs.dir(generatedBongBlockDir)

    doLast {
        def manifest = new JsonSlurper().parse(bongBlockManifest)
        def packageDir = generatedBongBlockDir.get().asFile.toPath()
            .resolve('com')
            .resolve('bong')
            .resolve('client')
            .resolve('block')
        packageDir.toFile().mkdirs()

        int nextBlockId = 1003
        int nextStateId = 24135
        def lines = [
            'package com.bong.client.block;',
            '',
            'public final class BongBlockIds {',
            '    public static final int BONG_BLOCK_ID_START = 1003;',
            '    public static final int BONG_BLOCK_STATE_START = 24135;',
            ''
        ]

        manifest.blocks.each { block ->
            def constName = block.name.toUpperCase(Locale.ROOT).replaceAll('[^A-Z0-9]+', '_')
            int blockId = nextBlockId
            int stateId = nextStateId
            int stateCount = 1
            block.properties.each { property ->
                stateCount *= property.values.size()
            }

            lines += "    public static final int ${constName}_BLOCK_ID = ${blockId};"
            lines += "    public static final int ${constName}_STATE_ID = ${stateId};"
            lines += "    public static final int ${constName}_STATE_COUNT = ${stateCount};"
            lines += ''

            nextBlockId += 1
            nextStateId += stateCount
        }

        lines += '    private BongBlockIds() {}'
        lines += '}'
        packageDir.resolve('BongBlockIds.java').toFile().text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

sourceSets {
    main {
        java {
            srcDir generatedBongBlockDir
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.dependsOn(tasks.named('generateBongBlockIds'))
}

tasks.withType(Test) {
    useJUnitPlatform()
}

tasks.named('runGametest') {
    doFirst {
        // Dedicated GameTest servers require an explicit EULA acceptance even on a fresh CI runner.
        def eulaFile = file('build/gametest/eula.txt')
        eulaFile.parentFile.mkdirs()
        eulaFile.setText('eula=true\n', 'UTF-8')
    }
}

tasks.named('test') {
    dependsOn(tasks.named('runGametest'))

    // SkillParticleSpecDocTest 跨目录读 plan §P5.1 粒子 spec 表做对拍。该文件不在 test
    // sourceSet 里，不声明成任务输入的话：只改 spec 表、不改测试代码时 gradle 会判
    // UP-TO-DATE 直接跳过，漂移就悄悄溜过去了——正是这类对拍测试要防的事。
    // （plan 归档后路径会从 docs/ 变到 docs/finished_plans/，两处都列。）
    inputs.files(
        files(
            '../docs/plan-skill-anim-fidelity-v1.md',
            '../docs/finished_plans/plan-skill-anim-fidelity-v1.md'
        ).filter { it.exists() }
    ).withPropertyName('skillParticleSpecDoc')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

// runClientPreview — Bong client/server headless preview handoff。
// 行为：继承 fabric-loom 的 runClient，自动设 BONG_PREVIEW_HARNESS=1 并把
// BONG_PREVIEW_CONFIG 默认指向 client/preview-harness.json（绝对路径，避免
// client/run/ 作为 cwd 时的相对路径误解）。
//
// 调用：
//   ../scripts/build-token.sh gradle runClientPreview                      # 用默认 client/preview-harness.json
//   BONG_PREVIEW_CONFIG=/abs/cfg.json ../scripts/build-token.sh gradle runClientPreview
//
// CI 上需 xvfb-run 包：
//   xvfb-run -a --server-args='-screen 0 1280x720x24' ../scripts/build-token.sh gradle runClientPreview
// loom 1.6-SNAPSHOT 不带 useXVFB，须显式包；ubuntu-24.04 预装 xvfb 21.x，无需 apt。
//
// 退出条件由 mod 内 PreviewSession 调用 client.scheduleStop()（不会自然退出）。
tasks.register('runClientPreview') {
    group = 'fabric'
    description = 'Run Fabric client with preview harness env enabled (external raster handoff)'
    dependsOn('runClient')
}

// runClientUiPreview — 不连服务器，使用固定本地 fixture 打开真实 Screen 并截图。
// 该入口验证的是 Minecraft 字体、GUI scale、owo inflate/mount 和 framebuffer，
// 不以离线 XML 模拟图替代 production renderer。
tasks.register('runClientUiPreview') {
    group = 'fabric'
    description = 'Run deterministic Fabric/owo UI screenshot scenarios'
    dependsOn('runClient')
    doLast {
        def configuredPath = System.getenv('BONG_UI_PREVIEW_CONFIG')
            ?: file('ui-preview-harness.json').absolutePath
        def previewConfig = new groovy.json.JsonSlurper().parse(file(configuredPath))
        def configuredOutput = new File(previewConfig.output_dir ?: 'ui-preview-screenshots')
        def outputDir = configuredOutput.isAbsolute() ? configuredOutput : file('run/' + configuredOutput)
        def resultFile = new File(outputDir, 'ui-preview-result.txt')
        if (!resultFile.isFile()) {
            throw new GradleException(
                "UI preview 未生成本轮结果标记，客户端可能在状态机结束前退出: ${resultFile}")
        }
        def result = resultFile.readLines().findAll { it.contains('=') }.collectEntries { line ->
            def parts = line.split('=', 2)
            [(parts[0]): parts[1]]
        }
        def expectedCount = previewConfig.screenshots.size().toString()
        if (result.status != 'passed' || result.completed != expectedCount) {
            throw new GradleException(
                "UI preview 失败: status=${result.status}, completed=${result.completed}/${expectedCount}, "
                    + "phase=${result.phase}, shot=${result.shot}, detail=${result.detail}")
        }
    }
}

tasks.named('runClient').configure {
    // GeckoLib 在 dev 环境默认注册 example blocks/entities，会抢占 Bong 固定协议 raw id。
    // 生产 jar 不会注册这些 examples；runClient 需显式关闭，保持本地验证对齐 server。
    jvmArgs '-Dgeckolib.disable_examples=true'
    jvmArgs '-Dsodium.checks.issue2561=false'

    def isPreviewRun = gradle.startParameter.taskNames.any {
        it == 'runClientPreview' || it.endsWith(':runClientPreview')
    }
    def isUiPreviewRun = gradle.startParameter.taskNames.any {
        it == 'runClientUiPreview' || it.endsWith(':runClientUiPreview')
    }
    if (isPreviewRun) {
        environment 'BONG_PREVIEW_HARNESS', '1'
        if (System.getenv('BONG_PREVIEW_CONFIG') == null) {
            environment 'BONG_PREVIEW_CONFIG', file('preview-harness.json').absolutePath
        }
        // MC 1.20.1 vanilla Main 解析 --quickPlayMultiplayer（23w14a 引入），
        // 让 client 启动后跳过主菜单直接连 server。不加这个 client 卡在标题
        // 屏，PreviewSession.WAIT_WORLD 永远等不到 client.world，60s 后超时
        // 退出 → artifact 0 张图（首轮 CI 实测命中此 bug）。
        def previewServer = System.getenv('BONG_PREVIEW_SERVER') ?: '127.0.0.1:25565'
        args '--quickPlayMultiplayer', previewServer
    }
    if (isUiPreviewRun) {
        environment 'BONG_UI_PREVIEW_HARNESS', '1'
        def configuredPath = System.getenv('BONG_UI_PREVIEW_CONFIG')
            ?: file('ui-preview-harness.json').absolutePath
        environment 'BONG_UI_PREVIEW_CONFIG', configuredPath
        doFirst {
            // 先清理旧结果，避免客户端启动阶段异常时误读上一次的成功标记。
            def previewConfig = new groovy.json.JsonSlurper().parse(file(configuredPath))
            def configuredOutput = new File(previewConfig.output_dir ?: 'ui-preview-screenshots')
            def outputDir = configuredOutput.isAbsolute() ? configuredOutput : file('run/' + configuredOutput)
            delete new File(outputDir, 'ui-preview-result.txt')
        }
    }
}
